name: Build ServerTeleport Velocity Bridge v1.5.0

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Create project
        shell: bash
        run: |
          set -e
          mkdir -p src/main/java/pl/reniferek/servertp src/main/resources

          cat > pom.xml <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>pl.reniferek</groupId><artifactId>ServerTeleport-Velocity</artifactId><version>1.5.0</version>
            <properties><maven.compiler.release>21</maven.compiler.release><project.build.sourceEncoding>UTF-8</project.build.sourceEncoding></properties>
            <repositories><repository><id>papermc</id><url>https://repo.papermc.io/repository/maven-public/</url></repository></repositories>
            <dependencies><dependency><groupId>com.velocitypowered</groupId><artifactId>velocity-api</artifactId><version>3.4.0-SNAPSHOT</version><scope>provided</scope></dependency></dependencies>
            <build><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId><version>3.13.0</version><configuration><release>21</release></configuration></plugin></plugins></build>
          </project>
          POM

          cat > src/main/resources/velocity-plugin.json <<'JSON'
          {"id":"serverteleport","name":"ServerTeleport","version":"1.5.0","authors":["Reniferek"],"dependencies":[],"main":"pl.reniferek.servertp.ServerTeleportVelocity"}
          JSON

          cat > src/main/java/pl/reniferek/servertp/ServerTeleportVelocity.java <<'JAVA'
          package pl.reniferek.servertp;

          import com.google.common.io.ByteArrayDataInput;
          import com.google.common.io.ByteArrayDataOutput;
          import com.google.common.io.ByteStreams;
          import com.google.inject.Inject;
          import com.velocitypowered.api.command.CommandSource;
          import com.velocitypowered.api.command.SimpleCommand;
          import com.velocitypowered.api.event.Subscribe;
          import com.velocitypowered.api.event.connection.DisconnectEvent;
          import com.velocitypowered.api.event.connection.PluginMessageEvent;
          import com.velocitypowered.api.event.player.ServerPostConnectEvent;
          import com.velocitypowered.api.event.proxy.ProxyInitializeEvent;
          import com.velocitypowered.api.proxy.Player;
          import com.velocitypowered.api.proxy.ProxyServer;
          import com.velocitypowered.api.proxy.ServerConnection;
          import com.velocitypowered.api.proxy.messages.MinecraftChannelIdentifier;
          import com.velocitypowered.api.proxy.server.RegisteredServer;
          import com.velocitypowered.api.proxy.server.ServerPing;
          import com.velocitypowered.api.scheduler.ScheduledTask;
          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;

          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.List;
          import java.util.Locale;
          import java.util.Optional;
          import java.util.Properties;
          import java.util.concurrent.TimeUnit;

          public final class ServerTeleportVelocity {
              private static final String TARGET_SERVER = "LifeStealSMPspawn";
              private static final List<String> HUBS = List.of("hub1", "hub2", "hub3");
              private static final MinecraftChannelIdentifier TELEPORT_CHANNEL = MinecraftChannelIdentifier.create("serverteleport", "main");
              private static final MinecraftChannelIdentifier STATS_CHANNEL = MinecraftChannelIdentifier.create("serverteleport", "stats");

              private final ProxyServer proxy;
              private final Path dataDirectory;
              private volatile boolean blockade;
              private volatile int lifeStealOnline;
              private volatile int lifeStealMax;
              private volatile boolean lifeStealReachable;
              private volatile ScheduledTask pingTask;

              @Inject
              public ServerTeleportVelocity(ProxyServer proxy,
                      @com.velocitypowered.api.plugin.annotation.DataDirectory Path dataDirectory) {
                  this.proxy = proxy;
                  this.dataDirectory = dataDirectory;
                  loadConfig();
              }

              @Subscribe
              public void onProxyInitialization(ProxyInitializeEvent event) {
                  proxy.getChannelRegistrar().register(TELEPORT_CHANNEL, STATS_CHANNEL);
                  proxy.getCommandManager().register(proxy.getCommandManager().metaBuilder("blokadaLifeStealSMP").build(), new BlockadeCommand());
                  proxy.getCommandManager().register(proxy.getCommandManager().metaBuilder("statusLifeStealSMP").build(), new StatusCommand());
                  pingTarget();
                  pingTask = proxy.getScheduler().buildTask(this, this::pingTarget).repeat(15, TimeUnit.SECONDS).schedule();
              }

              @Subscribe
              public void onPluginMessage(PluginMessageEvent event) {
                  if (!TELEPORT_CHANNEL.equals(event.getIdentifier()) && !STATS_CHANNEL.equals(event.getIdentifier())) return;
                  event.setResult(PluginMessageEvent.ForwardResult.handled());
                  if (!(event.getSource() instanceof ServerConnection connection)) return;
                  if (TELEPORT_CHANNEL.equals(event.getIdentifier())) handleTeleport(connection, event.getData());
                  else handleStatsRequest(connection, event.getData());
              }

              private void handleTeleport(ServerConnection connection, byte[] data) {
                  ByteArrayDataInput in = ByteStreams.newDataInput(data);
                  try {
                      if (!"CHECK".equals(in.readUTF())) return;
                      if (!TARGET_SERVER.equalsIgnoreCase(in.readUTF())) return;
                  } catch (Exception ignored) { return; }

                  Player player = connection.getPlayer();
                  if (blockade) {
                      player.sendMessage(Component.text("LifeStealSMP jest aktualnie zablokowany.", NamedTextColor.RED));
                      return;
                  }
                  Optional<RegisteredServer> optional = proxy.getServer(TARGET_SERVER);
                  if (optional.isEmpty() || !lifeStealReachable) {
                      player.sendMessage(Component.text("LifeStealSMP jest aktualnie wyłączony.", NamedTextColor.RED));
                      return;
                  }
                  RegisteredServer server = optional.get();
                  player.createConnectionRequest(server).connect().thenAccept(result -> {
                      if (!result.isSuccessful() && player.isActive()) {
                          player.sendMessage(Component.text("Nie udało się połączyć z LifeStealSMP.", NamedTextColor.RED));
                      }
                  }).exceptionally(error -> {
                      if (player.isActive()) player.sendMessage(Component.text("Nie udało się połączyć z LifeStealSMP.", NamedTextColor.RED));
                      return null;
                  });
              }

              private void handleStatsRequest(ServerConnection connection, byte[] data) {
                  try {
                      if (!"REQUEST".equals(ByteStreams.newDataInput(data).readUTF())) return;
                  } catch (Exception ignored) { return; }
                  sendStats(connection);
              }

              @Subscribe
              public void onServerPostConnect(ServerPostConnectEvent event) {
                  RegisteredServer current = event.getPlayer().getCurrentServer().map(ServerConnection::getServer).orElse(null);
                  RegisteredServer previous = event.getPreviousServer();
                  if (current != null && isTarget(current)) updateOnlineFromConnection(current);
                  if (previous != null && isTarget(previous)) updateOnlineFromConnection(previous);
              }

              @Subscribe
              public void onDisconnect(DisconnectEvent event) {
                  RegisteredServer current = event.getPlayer().getCurrentServer().map(ServerConnection::getServer).orElse(null);
                  if (current != null && isTarget(current)) updateOnlineFromConnection(current);
              }

              private void updateOnlineFromConnection(RegisteredServer server) {
                  int next = Math.max(0, server.getPlayersConnected().size());
                  if (next != lifeStealOnline) {
                      lifeStealOnline = next;
                      broadcastStats();
                  }
              }

              private void pingTarget() {
                  Optional<RegisteredServer> optional = proxy.getServer(TARGET_SERVER);
                  if (optional.isEmpty()) {
                      applyPingState(false, 0);
                      return;
                  }
                  RegisteredServer server = optional.get();
                  server.ping().whenComplete((ping, error) -> {
                      if (error != null || ping == null) {
                          applyPingState(false, 0);
                          return;
                      }
                      int max = ping.getPlayers().map(ServerPing.Players::getMax).orElse(lifeStealMax);
                      int online = Math.max(0, server.getPlayersConnected().size());
                      boolean changed = !lifeStealReachable || lifeStealMax != max || lifeStealOnline != online;
                      lifeStealReachable = true;
                      lifeStealMax = Math.max(0, max);
                      lifeStealOnline = online;
                      if (changed) broadcastStats();
                  });
              }

              private void applyPingState(boolean reachable, int max) {
                  boolean changed = lifeStealReachable || lifeStealMax != max || lifeStealOnline != 0;
                  lifeStealReachable = reachable;
                  lifeStealMax = Math.max(0, max);
                  lifeStealOnline = 0;
                  if (changed) broadcastStats();
              }

              private boolean isTarget(RegisteredServer server) {
                  return TARGET_SERVER.equalsIgnoreCase(server.getServerInfo().getName());
              }

              private void sendStats(ServerConnection connection) {
                  ByteArrayDataOutput out = ByteStreams.newDataOutput();
                  out.writeUTF("STATS");
                  out.writeInt(Math.max(0, lifeStealOnline));
                  out.writeInt(Math.max(0, lifeStealMax));
                  out.writeBoolean(lifeStealReachable);
                  out.writeBoolean(blockade);
                  connection.sendPluginMessage(STATS_CHANNEL, out.toByteArray());
              }

              private void broadcastStats() {
                  for (String hubName : HUBS) {
                      Optional<RegisteredServer> hub = proxy.getServer(hubName);
                      if (hub.isEmpty()) continue;
                      for (Player player : hub.get().getPlayersConnected()) {
                          ServerConnection connection = player.getCurrentServer().orElse(null);
                          if (connection != null && hubName.equalsIgnoreCase(connection.getServer().getServerInfo().getName())) {
                              sendStats(connection);
                          }
                      }
                  }
              }

              private void loadConfig() {
                  try {
                      Files.createDirectories(dataDirectory);
                      Path file = dataDirectory.resolve("config.properties");
                      Properties p = new Properties();
                      if (Files.exists(file)) {
                          try (var reader = Files.newBufferedReader(file)) { p.load(reader); }
                      }
                      blockade = Boolean.parseBoolean(p.getProperty("blockade", "false"));
                  } catch (IOException ignored) {
                      blockade = false;
                  }
              }

              private void saveConfig() {
                  try {
                      Files.createDirectories(dataDirectory);
                      Path file = dataDirectory.resolve("config.properties");
                      Properties p = new Properties();
                      p.setProperty("blockade", Boolean.toString(blockade));
                      try (var writer = Files.newBufferedWriter(file)) { p.store(writer, "ServerTeleport"); }
                  } catch (IOException ignored) { }
              }

              private final class BlockadeCommand implements SimpleCommand {
                  @Override public void execute(Invocation invocation) {
                      String[] args = invocation.arguments();
                      if (args.length != 1 || (!args[0].equalsIgnoreCase("on") && !args[0].equalsIgnoreCase("off"))) {
                          invocation.source().sendMessage(Component.text("Użycie: /blokadaLifeStealSMP on|off", NamedTextColor.RED));
                          return;
                      }
                      boolean next = args[0].equalsIgnoreCase("on");
                      if (next != blockade) {
                          blockade = next;
                          saveConfig();
                          broadcastStats();
                      }
                      invocation.source().sendMessage(Component.text("LifeStealSMP: " + (blockade ? "ZABLOKOWANY" : "ODBLOKOWANY"), blockade ? NamedTextColor.RED : NamedTextColor.GREEN));
                  }
                  @Override public List<String> suggest(Invocation invocation) {
                      return List.of("on", "off");
                  }
              }

              private final class StatusCommand implements SimpleCommand {
                  @Override public void execute(Invocation invocation) {
                      pingTarget();
                      invocation.source().sendMessage(Component.text("LifeStealSMP: " + (lifeStealReachable ? "URUCHOMIONY" : "WYŁĄCZONY") + " | " + lifeStealOnline + "/" + lifeStealMax,
                              lifeStealReachable ? NamedTextColor.GREEN : NamedTextColor.RED));
                  }
              }
          }
          JAVA

      - name: Build
        run: mvn -B package --no-transfer-progress

      - name: Prepare ZIP
        run: |
          mkdir -p release
          cp target/ServerTeleport-Velocity-1.5.0.jar release/ServerTeleport-Velocity.jar
          cd release
          zip -9 ../ServerTeleport-Velocity-OPTIMIZED.zip ServerTeleport-Velocity.jar

      - uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport-Velocity-OPTIMIZED
          path: ServerTeleport-Velocity-OPTIMIZED.zip
          if-no-files-found: error
