name: Build ServerTeleport Paper + Velocity

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Paper + Velocity
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # =========================================================
      # PAPER
      # =========================================================

      - name: Create Paper project
        shell: bash
        run: |
          set -e

          mkdir -p paper/src/main/java/pl/reniferek/servertp
          mkdir -p paper/src/main/resources

          cat > paper/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">

              <modelVersion>4.0.0</modelVersion>

              <groupId>pl.reniferek</groupId>
              <artifactId>ServerTeleport-Paper</artifactId>
              <version>1.1.0</version>

              <properties>
                  <maven.compiler.release>21</maven.compiler.release>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.4-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>

                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>

                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-jar-plugin</artifactId>
                          <version>3.4.2</version>
                      </plugin>

                  </plugins>
              </build>

          </project>
          EOF

          cat > paper/src/main/resources/plugin.yml <<'EOF'
          name: ServerTeleport
          version: 1.1.0
          main: pl.reniferek.servertp.ServerTeleport
          api-version: '1.21'
          author: Reniferek
          description: Lekki system Paper -> Velocity.
          EOF

          cat > paper/src/main/resources/config.yml <<'EOF'
          server: "LifeStealSMPspawn"

          min-x: -4
          max-x: 4

          min-y: 68
          max-y: 77

          z: 9

          require-air: false
          once-per-entry: true
          EOF

          cat > paper/src/main/java/pl/reniferek/servertp/ServerTeleport.java <<'EOF'
          package pl.reniferek.servertp;

          import com.google.common.io.ByteArrayDataOutput;
          import com.google.common.io.ByteStreams;

          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.EventPriority;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.event.player.PlayerQuitEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          public final class ServerTeleport extends JavaPlugin implements Listener {

              private static final String CHANNEL = "serverteleport:main";

              private String targetServer;

              private int minX;
              private int maxX;
              private int minY;
              private int maxY;
              private int targetZ;

              private boolean requireAir;
              private boolean oncePerEntry;

              private final Set<UUID> insidePlayers = new HashSet<>();

              @Override
              public void onEnable() {

                  saveDefaultConfig();

                  targetServer = getConfig().getString(
                          "server",
                          "LifeStealSMPspawn"
                  );

                  minX = getConfig().getInt("min-x", -4);
                  maxX = getConfig().getInt("max-x", 4);

                  minY = getConfig().getInt("min-y", 68);
                  maxY = getConfig().getInt("max-y", 77);

                  targetZ = getConfig().getInt("z", 9);

                  requireAir = getConfig().getBoolean(
                          "require-air",
                          false
                  );

                  oncePerEntry = getConfig().getBoolean(
                          "once-per-entry",
                          true
                  );

                  getServer().getMessenger()
                          .registerOutgoingPluginChannel(
                                  this,
                                  CHANNEL
                          );

                  getServer().getPluginManager()
                          .registerEvents(this, this);
              }

              @Override
              public void onDisable() {

                  insidePlayers.clear();

                  getServer().getMessenger()
                          .unregisterOutgoingPluginChannel(
                                  this,
                                  CHANNEL
                          );
              }

              @EventHandler(
                      priority = EventPriority.MONITOR,
                      ignoreCancelled = true
              )
              public void onMove(PlayerMoveEvent event) {

                  /*
                   * Najważniejsza optymalizacja.
                   * Obracanie kamerą bez zmiany bloku
                   * kończy się natychmiast.
                   */
                  if (!event.hasChangedBlock()) {
                      return;
                  }

                  final Player player = event.getPlayer();

                  final int x = event.getTo().getBlockX();
                  final int y = event.getTo().getBlockY();
                  final int z = event.getTo().getBlockZ();

                  final UUID uuid = player.getUniqueId();

                  /*
                   * Sprawdzenie obszaru portalu.
                   */
                  if (
                          x < minX ||
                          x > maxX ||
                          y < minY ||
                          y > maxY ||
                          z != targetZ
                  ) {

                      if (oncePerEntry) {
                          insidePlayers.remove(uuid);
                      }

                      return;
                  }

                  /*
                   * Opcjonalne wymaganie powietrza.
                   */
                  if (
                          requireAir &&
                          !event.getTo().getBlock().isEmpty()
                  ) {
                      return;
                  }

                  /*
                   * Tylko jedno uruchomienie
                   * podczas jednego wejścia.
                   */
                  if (
                          oncePerEntry &&
                          !insidePlayers.add(uuid)
                  ) {
                      return;
                  }

                  sendTeleportRequest(player);
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent event) {

                  if (oncePerEntry) {
                      insidePlayers.remove(
                              event.getPlayer().getUniqueId()
                      );
                  }
              }

              private void sendTeleportRequest(Player player) {

                  final ByteArrayDataOutput output =
                          ByteStreams.newDataOutput();

                  output.writeUTF("CHECK");
                  output.writeUTF(targetServer);

                  player.sendPluginMessage(
                          this,
                          CHANNEL,
                          output.toByteArray()
                  );
              }
          }
          EOF

      - name: Build Paper
        working-directory: paper
        run: mvn -B clean package

      # =========================================================
      # VELOCITY
      # =========================================================

      - name: Create Velocity project
        shell: bash
        run: |
          set -e

          mkdir -p velocity/src/main/java/pl/reniferek/servertp
          mkdir -p velocity/src/main/resources

          cat > velocity/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">

              <modelVersion>4.0.0</modelVersion>

              <groupId>pl.reniferek</groupId>
              <artifactId>ServerTeleport-Velocity</artifactId>
              <version>1.4.0</version>

              <properties>
                  <maven.compiler.release>21</maven.compiler.release>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>com.velocitypowered</groupId>
                      <artifactId>velocity-api</artifactId>
                      <version>3.4.0-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>

                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>

                              <annotationProcessorPaths>
                                  <path>
                                      <groupId>com.velocitypowered</groupId>
                                      <artifactId>velocity-api</artifactId>
                                      <version>3.4.0-SNAPSHOT</version>
                                  </path>
                              </annotationProcessorPaths>
                          </configuration>
                      </plugin>

                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-jar-plugin</artifactId>
                          <version>3.4.2</version>
                      </plugin>

                  </plugins>
              </build>

          </project>
          EOF

          cat > velocity/src/main/resources/velocity-plugin.json <<'EOF'
          {
            "id": "servertp",
            "name": "ServerTeleport",
            "version": "1.4.0",
            "description": "Lekki system Paper -> Velocity.",
            "authors": [
              "Reniferek"
            ],
            "main": "pl.reniferek.servertp.ServerTeleportVelocity"
          }
          EOF

          cat > velocity/src/main/java/pl/reniferek/servertp/ServerTeleportVelocity.java <<'EOF'
          package pl.reniferek.servertp;

          import com.google.common.io.ByteArrayDataInput;
          import com.google.common.io.ByteStreams;
          import com.google.inject.Inject;

          import com.velocitypowered.api.command.SimpleCommand;
          import com.velocitypowered.api.event.Subscribe;
          import com.velocitypowered.api.event.connection.PluginMessageEvent;
          import com.velocitypowered.api.event.proxy.ProxyInitializeEvent;
          import com.velocitypowered.api.plugin.Plugin;

          import com.velocitypowered.api.proxy.Player;
          import com.velocitypowered.api.proxy.ProxyServer;
          import com.velocitypowered.api.proxy.ServerConnection;

          import com.velocitypowered.api.proxy.messages.MinecraftChannelIdentifier;
          import com.velocitypowered.api.proxy.server.RegisteredServer;

          import net.kyori.adventure.text.Component;

          import java.util.Optional;

          @Plugin(
                  id = "servertp",
                  name = "ServerTeleport",
                  version = "1.4.0",
                  description = "Lekki system Paper -> Velocity.",
                  authors = {"Reniferek"}
          )
          public final class ServerTeleportVelocity {

              private static final String TARGET_SERVER =
                      "LifeStealSMPspawn";

              private static final MinecraftChannelIdentifier CHANNEL =
                      MinecraftChannelIdentifier.create(
                              "serverteleport",
                              "main"
                      );

              private final ProxyServer proxy;

              /*
               * true  = LifeStealSMP otwarty
               * false = LifeStealSMP zablokowany
               */
              private volatile boolean open = true;

              @Inject
              public ServerTeleportVelocity(
                      ProxyServer proxy
              ) {
                  this.proxy = proxy;
              }

              @Subscribe
              public void onProxyInitialization(
                      ProxyInitializeEvent event
              ) {

                  proxy.getChannelRegistrar()
                          .register(CHANNEL);

                  proxy.getCommandManager().register(
                          proxy.getCommandManager()
                                  .metaBuilder(
                                          "blokadaLifeStealSMP"
                                  )
                                  .build(),
                          new BlockCommand()
                  );

                  proxy.getCommandManager().register(
                          proxy.getCommandManager()
                                  .metaBuilder(
                                          "statusLifeStealSMP"
                                  )
                                  .build(),
                          new StatusCommand()
                  );
              }

              @Subscribe
              public void onPluginMessage(
                      PluginMessageEvent event
              ) {

                  /*
                   * Najpierw sprawdzamy kanał.
                   */
                  if (!CHANNEL.equals(event.getIdentifier())) {
                      return;
                  }

                  /*
                   * Obsługujemy wiadomość całkowicie.
                   * Nie przekazujemy jej dalej.
                   */
                  event.setResult(
                          PluginMessageEvent.ForwardResult.handled()
                  );

                  /*
                   * Wiadomość musi pochodzić
                   * z backendowego serwera.
                   */
                  if (!(event.getSource()
                          instanceof ServerConnection connection)) {
                      return;
                  }

                  /*
                   * Gracz jest przypisany do ServerConnection.
                   */
                  final Player player =
                          connection.getPlayer();

                  /*
                   * Odczyt wiadomości.
                   */
                  final ByteArrayDataInput input =
                          ByteStreams.newDataInput(
                                  event.getData()
                          );

                  final String action;

                  try {
                      action = input.readUTF();
                  } catch (Exception ignored) {
                      return;
                  }

                  if (!"CHECK".equals(action)) {
                      return;
                  }

                  final String requestedServer;

                  try {
                      requestedServer = input.readUTF();
                  } catch (Exception ignored) {
                      return;
                  }

                  /*
                   * Zabezpieczenie:
                   * plugin może przekierować tylko
                   * na LifeStealSMPspawn.
                   */
                  if (!TARGET_SERVER.equals(requestedServer)) {
                      return;
                  }

                  /*
                   * Sprawdzenie blokady.
                   */
                  if (!open) {

                      player.sendMessage(
                              Component.text(
                                      "LifeStealSMP jest aktualnie zablokowany."
                              )
                      );

                      return;
                  }

                  /*
                   * Pobranie serwera z Velocity.
                   */
                  final Optional<RegisteredServer> optional =
                          proxy.getServer(TARGET_SERVER);

                  if (optional.isEmpty()) {

                      player.sendMessage(
                              Component.text(
                                      "LifeStealSMP jest aktualnie wyłączony."
                              )
                      );

                      return;
                  }

                  final RegisteredServer target =
                          optional.get();

                  /*
                   * Ping jest wykonywany tylko wtedy,
                   * gdy gracz faktycznie użyje portalu.
                   *
                   * Nie ma żadnego pingowania co sekundę,
                   * co tick ani w tle.
                   */
                  target.ping().whenComplete(
                          (ping, error) -> {

                              if (error != null) {

                                  if (player.isActive()) {
                                      player.sendMessage(
                                              Component.text(
                                                      "LifeStealSMP jest aktualnie wyłączony."
                                              )
                                      );
                                  }

                                  return;
                              }

                              /*
                               * Sprawdzenie, czy gracz nadal jest online.
                               */
                              if (!player.isActive()) {
                                  return;
                              }

                              /*
                               * Blokada mogła zostać zmieniona
                               * podczas wykonywania pinga.
                               */
                              if (!open) {

                                  player.sendMessage(
                                          Component.text(
                                                  "LifeStealSMP jest aktualnie zablokowany."
                                          )
                                  );

                                  return;
                              }

                              /*
                               * Połączenie z LifeStealSMP.
                               */
                              player.createConnectionRequest(target)
                                      .connect()
                                      .thenAccept(result -> {

                                          if (!result.isSuccessful()
                                                  && player.isActive()) {

                                              player.sendMessage(
                                                      Component.text(
                                                              "Nie udało się połączyć z LifeStealSMP."
                                                      )
                                              );
                                          }
                                      })
                                      .exceptionally(connectionError -> {

                                          if (player.isActive()) {

                                              player.sendMessage(
                                                      Component.text(
                                                              "Nie udało się połączyć z LifeStealSMP."
                                                      )
                                              );
                                          }

                                          return null;
                                      });
                          }
                  );
              }

              // =====================================================
              // /blokadaLifeStealSMP
              // =====================================================

              private final class BlockCommand
                      implements SimpleCommand {

                  @Override
                  public void execute(
                          Invocation invocation
                  ) {

                      final String[] args =
                              invocation.arguments();

                      if (args.length != 1) {

                          invocation.source().sendMessage(
                                  Component.text(
                                          "/blokadaLifeStealSMP on/off"
                                  )
                          );

                          return;
                      }

                      /*
                       * ON = otwórz LifeStealSMP.
                       */
                      if (args[0].equalsIgnoreCase("on")) {

                          open = true;

                          invocation.source().sendMessage(
                                  Component.text(
                                          "LifeStealSMP: OTWARTY"
                                  )
                          );

                          return;
                      }

                      /*
                       * OFF = zablokuj LifeStealSMP.
                       */
                      if (args[0].equalsIgnoreCase("off")) {

                          open = false;

                          invocation.source().sendMessage(
                                  Component.text(
                                          "LifeStealSMP: ZABLOKOWANY"
                                  )
                          );

                          return;
                      }

                      invocation.source().sendMessage(
                              Component.text(
                                      "/blokadaLifeStealSMP on/off"
                              )
                      );
                  }
              }

              // =====================================================
              // /statusLifeStealSMP
              // =====================================================

              private final class StatusCommand
                      implements SimpleCommand {

                  @Override
                  public void execute(
                          Invocation invocation
                  ) {

                      final Optional<RegisteredServer> optional =
                              proxy.getServer(TARGET_SERVER);

                      invocation.source().sendMessage(
                              Component.text(
                                      "§7§m--------------------"
                              )
                      );

                      invocation.source().sendMessage(
                              Component.text(
                                      "§eLifeStealSMP"
                              )
                      );

                      invocation.source().sendMessage(
                              Component.text(
                                      "§7Blokada: " +
                                              (open
                                                      ? "§aODBLOKOWANY"
                                                      : "§cZABLOKOWANY")
                              )
                      );

                      if (optional.isEmpty()) {

                          invocation.source().sendMessage(
                                  Component.text(
                                          "§7Serwer: §cWYŁĄCZONY"
                                  )
                          );

                          invocation.source().sendMessage(
                                  Component.text(
                                          "§7§m--------------------"
                                  )
                          );

                          return;
                      }

                      /*
                       * Status robi pojedynczy ping
                       * tylko po wpisaniu komendy.
                       */
                      optional.get().ping().whenComplete(
                              (ping, error) -> {

                                  invocation.source().sendMessage(
                                          Component.text(
                                                  "§7Serwer: " +
                                                          (error == null
                                                                  ? "§aURUCHOMIONY"
                                                                  : "§cWYŁĄCZONY")
                                          )
                                  );

                                  invocation.source().sendMessage(
                                          Component.text(
                                                  "§7§m--------------------"
                                          )
                                  );
                              }
                      );
                  }
              }
          }
          EOF

      - name: Build Velocity
        working-directory: velocity
        run: mvn -B clean package

      # =========================================================
      # GOTOWE JARY
      # =========================================================

      - name: Prepare plugins
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp \
            paper/target/ServerTeleport-Paper-1.1.0.jar \
            artifacts/ServerTeleport-Paper.jar

          cp \
            velocity/target/ServerTeleport-Velocity-1.4.0.jar \
            artifacts/ServerTeleport-Velocity.jar

      - name: Upload Paper
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport-Paper
          path: artifacts/ServerTeleport-Paper.jar
          if-no-files-found: error

      - name: Upload Velocity
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport-Velocity
          path: artifacts/ServerTeleport-Velocity.jar
          if-no-files-found: error
