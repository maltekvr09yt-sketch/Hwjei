name: Build VelocityLogin

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create project
        shell: bash
        run: |
          mkdir -p src/main/java/pl/velocitylogin
          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>pl.velocitylogin</groupId>
            <artifactId>VelocityLogin</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>com.velocitypowered</groupId>
                <artifactId>velocity-api</artifactId>
                <version>3.4.0-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration><release>21</release></configuration>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-shade-plugin</artifactId>
                  <version>3.6.0</version>
                  <executions>
                    <execution>
                      <phase>package</phase>
                      <goals><goal>shade</goal></goals>
                    </execution>
                  </executions>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat > src/main/java/pl/velocitylogin/VelocityLogin.java <<'EOF'
          package pl.velocitylogin;

          import com.google.inject.Inject;
          import com.velocitypowered.api.event.Subscribe;
          import com.velocitypowered.api.event.connection.DisconnectEvent;
          import com.velocitypowered.api.event.connection.LoginEvent;
          import com.velocitypowered.api.event.player.ServerPostConnectEvent;
          import com.velocitypowered.api.event.command.CommandExecuteEvent;
          import com.velocitypowered.api.plugin.Plugin;
          import com.velocitypowered.api.proxy.Player;
          import com.velocitypowered.api.proxy.ProxyServer;
          import com.velocitypowered.api.proxy.messages.MinecraftChannelIdentifier;
          import net.kyori.adventure.text.Component;
          import org.slf4j.Logger;

          import java.io.IOException;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.*;
          import java.security.MessageDigest;
          import java.time.LocalDateTime;
          import java.time.format.DateTimeFormatter;
          import java.util.*;
          import java.util.concurrent.ConcurrentHashMap;

          @Plugin(id="velocitylogin", name="VelocityLogin", version="1.0.0")
          public final class VelocityLogin {
              private static final MinecraftChannelIdentifier CHANNEL =
                      MinecraftChannelIdentifier.from("velocitylogin:main");
              private static final DateTimeFormatter DATE =
                      DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss");

              private final ProxyServer proxy;
              private final Logger logger;
              private final Path root = Path.of("plugins", "VelocityLogin");
              private final Path infoDir = root.resolve("gracze");
              private final Path secretDir = root.resolve("dane");

              private final Map<UUID, Long> sessions = new ConcurrentHashMap<>();
              private final Set<UUID> logged = ConcurrentHashMap.newKeySet();

              @Inject
              public VelocityLogin(ProxyServer proxy, Logger logger) {
                  this.proxy = proxy;
                  this.logger = logger;
                  try {
                      Files.createDirectories(infoDir);
                      Files.createDirectories(secretDir);
                  } catch (IOException e) {
                      logger.error("Nie można utworzyć folderów VelocityLogin", e);
                  }
                  proxy.getChannelRegistrar().register(CHANNEL);
              }

              @Subscribe
              public void onLogin(LoginEvent event) {
                  Player p = event.getPlayer();
                  sessions.put(p.getUniqueId(), System.currentTimeMillis());

                  try {
                      if (!Files.exists(infoFile(p))) {
                          createInfo(p);
                      }
                  } catch (IOException e) {
                      logger.error("Błąd tworzenia pliku gracza " + p.getUsername(), e);
                  }
              }

              @Subscribe
              public void onServerPostConnect(ServerPostConnectEvent event) {
                  sendState(event.getPlayer());
              }

              @Subscribe
              public void onDisconnect(DisconnectEvent event) {
                  Player p = event.getPlayer();
                  Long start = sessions.remove(p.getUniqueId());

                  if (start != null) {
                      try {
                          addPlayTime(p, Math.max(0L,
                                  (System.currentTimeMillis() - start) / 1000L));
                      } catch (IOException e) {
                          logger.error("Błąd zapisu czasu gry " + p.getUsername(), e);
                      }
                  }

                  logged.remove(p.getUniqueId());
              }

              @Subscribe
              public void onCommand(CommandExecuteEvent event) {
                  if (!(event.getCommandSource() instanceof Player p)) return;

                  String raw = event.getCommand();
                  if (raw == null || raw.isBlank()) return;

                  String[] args = raw.trim().split("\\s+");
                  String command = args[0].toLowerCase(Locale.ROOT);

                  if (!command.equals("zaloguj")
                          && !command.equals("zarejestruj")
                          && !command.equals("wyjerestruj")) {
                      return;
                  }

                  event.setResult(CommandExecuteEvent.CommandResult.denied());

                  try {
                      switch (command) {
                          case "zarejestruj" -> {
                              if (args.length != 3) {
                                  msg(p, "§cUżyj: /zarejestruj <hasło> <hasło>");
                                  return;
                              }
                              register(p, args[1], args[2]);
                          }
                          case "zaloguj" -> {
                              if (args.length != 2) {
                                  msg(p, "§cUżyj: /zaloguj <hasło>");
                                  return;
                              }
                              login(p, args[1]);
                          }
                          case "wyjerestruj" -> {
                              if (args.length != 2) {
                                  msg(p, "§cUżyj: /wyjerestruj <hasło>");
                                  return;
                              }
                              unregister(p, args[1]);
                          }
                      }
                  } catch (IOException e) {
                      logger.error("Błąd obsługi konta " + p.getUsername(), e);
                      msg(p, "§cWystąpił błąd podczas zapisu konta.");
                  }
              }

              private void register(Player p, String password, String confirm) throws IOException {
                  if (Files.exists(secretFile(p))) {
                      msg(p, "§cKonto jest już zajęte.");
                      return;
                  }

                  if (password.length() < 4) {
                      msg(p, "§cHasło musi mieć co najmniej 4 znaki.");
                      return;
                  }

                  if (!password.equals(confirm)) {
                      msg(p, "§cHasła nie są takie same.");
                      return;
                  }

                  Files.writeString(
                          secretFile(p),
                          "hash: " + hash(password) + "\n" +
                          "length: " + password.length() + "\n",
                          StandardCharsets.UTF_8
                  );

                  update(p, "Konto", "zajęte");
                  update(p, "Pokaż hasło", "false");
                  update(p, "Hasło", stars(password.length()));
                  update(p, "Data logowania", now());
                  update(p, "Ostatnie logowanie", now());
                  increment(p, "Ile razy gracz się zalogował");

                  logged.add(p.getUniqueId());
                  sendState(p);
                  msg(p, "§aKonto zostało zarejestrowane i zalogowane.");
              }

              private void login(Player p, String password) throws IOException {
                  Path file = secretFile(p);

                  if (!Files.exists(file)) {
                      msg(p, "§cNajpierw użyj /zarejestruj <hasło> <hasło>");
                      return;
                  }

                  String stored = value(Files.readString(file), "hash");

                  if (stored != null && stored.equals(hash(password))) {
                      logged.add(p.getUniqueId());

                      update(p, "Data logowania", now());
                      update(p, "Ostatnie logowanie", now());
                      increment(p, "Ile razy gracz się zalogował");

                      sendState(p);
                      msg(p, "§aZalogowano pomyślnie.");
                  } else {
                      increment(p, "Ile razy gracz wpisał niepoprawne hasło");
                      msg(p, "§cNiepoprawne hasło.");
                  }
              }

              private void unregister(Player p, String password) throws IOException {
                  Path file = secretFile(p);

                  if (!Files.exists(file)) {
                      msg(p, "§cKonto jest wolne.");
                      return;
                  }

                  String stored = value(Files.readString(file), "hash");

                  if (stored == null || !stored.equals(hash(password))) {
                      increment(p, "Ile razy gracz wpisał niepoprawne hasło");
                      msg(p, "§cNiepoprawne hasło.");
                      return;
                  }

                  Files.deleteIfExists(file);
                  logged.remove(p.getUniqueId());

                  update(p, "Konto", "wolne");
                  update(p, "Hasło", "brak");

                  sendState(p);
                  msg(p, "§aKonto wyrejestrowane. Użyj: /zarejestruj <hasło> <hasło>");
              }

              private void sendState(Player p) {
                  p.getCurrentServer().ifPresent(server ->
                          server.sendPluginMessage(
                                  CHANNEL,
                                  ((logged.contains(p.getUniqueId()) ? "UNLOCK|" : "LOCK|")
                                          + p.getUniqueId())
                                          .getBytes(StandardCharsets.UTF_8)
                          )
                  );
              }

              private void createInfo(Player p) throws IOException {
                  String ip = p.getRemoteAddress().getAddress().getHostAddress();
                  String premium = proxy.getConfiguration().isOnlineMode()
                          ? "premium"
                          : "no premium";
                  String now = now();

                  String text =
                          "Nick: " + p.getUsername() + "\n" +
                          "Konto: wolne\n" +
                          "IP gracza: " + ip + "\n" +
                          "Pokaż ip: true\n" +
                          "gracz ma: " + premium + "\n" +
                          "Logowanie ip: false\n" +
                          "Pokaż hasło: false\n" +
                          "Hasło: brak\n" +
                          "Data dołączenia: " + now + "\n" +
                          "Data logowania: brak\n" +
                          "Czas gry: 0h 0m 0s\n" +
                          "Ostatnie logowanie: brak\n" +
                          "Ile razy gracz się zalogował: 0\n" +
                          "Ile razy gracz wpisał niepoprawne hasło: 0\n";

                  Files.writeString(infoFile(p), text, StandardCharsets.UTF_8);
              }

              private void addPlayTime(Player p, long seconds) throws IOException {
                  Path file = infoFile(p);
                  String text = Files.readString(file);
                  long total = parseTime(value(text, "Czas gry")) + seconds;
                  Files.writeString(file,
                          replace(text, "Czas gry", formatTime(total)),
                          StandardCharsets.UTF_8);
              }

              private void increment(Player p, String key) throws IOException {
                  Path file = infoFile(p);
                  String text = Files.readString(file);
                  int n = intValue(value(text, key));
                  Files.writeString(file,
                          replace(text, key, String.valueOf(n + 1)),
                          StandardCharsets.UTF_8);
              }

              private void update(Player p, String key, String val) throws IOException {
                  Path file = infoFile(p);
                  String text = Files.readString(file);
                  Files.writeString(file,
                          replace(text, key, val),
                          StandardCharsets.UTF_8);
              }

              private Path infoFile(Player p) {
                  return infoDir.resolve(p.getUsername() + ".yml");
              }

              private Path secretFile(Player p) {
                  return secretDir.resolve(p.getUniqueId() + ".yml");
              }

              private static String hash(String password) {
                  try {
                      byte[] bytes = MessageDigest.getInstance("SHA-256")
                              .digest(password.getBytes(StandardCharsets.UTF_8));
                      return Base64.getEncoder().encodeToString(bytes);
                  } catch (Exception e) {
                      throw new IllegalStateException(e);
                  }
              }

              private static String value(String text, String key) {
                  if (text == null) return null;
                  for (String line : text.split("\\R")) {
                      if (line.startsWith(key + ": ")) {
                          return line.substring(key.length() + 2).trim();
                      }
                  }
                  return null;
              }

              private static String replace(String text, String key, String value) {
                  return text.replaceAll(
                          "(?m)^" + java.util.regex.Pattern.quote(key) + ":.*$",
                          java.util.regex.Matcher.quoteReplacement(key + ": " + value)
                  );
              }

              private static int intValue(String value) {
                  try {
                      return Integer.parseInt(value);
                  } catch (Exception e) {
                      return 0;
                  }
              }

              private static long parseTime(String value) {
                  if (value == null) return 0;
                  try {
                      String[] a = value.split("\\s+");
                      return Long.parseLong(a[0].replace("h", "")) * 3600L
                              + Long.parseLong(a[1].replace("m", "")) * 60L
                              + Long.parseLong(a[2].replace("s", ""));
                  } catch (Exception e) {
                      return 0;
                  }
              }

              private static String formatTime(long seconds) {
                  return (seconds / 3600L) + "h "
                          + ((seconds % 3600L) / 60L) + "m "
                          + (seconds % 60L) + "s";
              }

              private static String stars(int length) {
                  return "*".repeat(Math.max(0, length));
              }

              private static String now() {
                  return DATE.format(LocalDateTime.now());
              }

              private static void msg(Player p, String text) {
                  p.sendMessage(Component.text(text));
              }
          }
          EOF

      - name: Build
        run: mvn -q package

      - uses: actions/upload-artifact@v4
        with:
          name: VelocityLogin
          path: target/VelocityLogin-*.jar
