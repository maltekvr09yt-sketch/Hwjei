      - name: Build
        run: mvn -B package --no-transfer-progress
      - name: Prepare ZIP
        run: |
          mkdir -p release
          cp target/HologramPlugin-1.6.0.jar release/HologramPlugin.jar
          cd release
          zip -9 ../HologramPlugin-OPTIMIZED-v1.6.0.zip HologramPlugin.jar
      - uses: actions/upload-artifact@v4
        with:
          name: HologramPlugin-OPTIMIZED-v1.6.0
          path: HologramPlugin-OPTIMIZED-v1.6.0.zip
          if-no-files-found: error
