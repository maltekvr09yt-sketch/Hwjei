name: Build Hub2Protection

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Maven project
        run: |
          mkdir -p hub2protection/src/main/java/pl/reniferek/hub2protection

          cat > hub2protection/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>

            <groupId>pl.reniferek</groupId>
            <artifactId>Hub2Protection</artifactId>
            <version>1.0.0</version>

            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <release>21</release>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat > hub2protection/src/main/resources.yml <<'EOF'
          name: Hub2Protection
          version: 1.1.0
          main: pl.reniferek.hub2protection.Hub2Protection
          api-version: '1.21'
          author: Reniferek
          description: Hub2 protection and spawn teleport
          EOF

          mkdir -p hub2protection/src/main/resources
          mv hub2protection/src/main/resources.yml hub2protection/src/main/resources/plugin.yml

          cat > hub2protection/src/main/resources/config.yml <<'EOF'
          world: "hub2"
          hunger: true
          hearts: true
          teleport-on-join: true
          spawn:
            x: 0.5
            y: 66.0
            z: -20.5
            yaw: 0.0
            pitch: 0.0
          EOF

          cat > hub2protection/src/main/java/pl/reniferek/hub2protection/Hub2Protection.java <<'EOF'
          package pl.reniferek.hub2protection;

          import org.bukkit.Location;
          import org.bukkit.World;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.EventPriority;
          import org.bukkit.event.Listener;
          import org.bukkit.event.entity.EntityDamageEvent;
          import org.bukkit.event.entity.FoodLevelChangeEvent;
          import org.bukkit.event.player.PlayerChangedWorldEvent;
          import org.bukkit.event.player.PlayerJoinEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          public final class Hub2Protection extends JavaPlugin implements Listener {
              private String worldName;
              private boolean hunger;
              private boolean hearts;
              private boolean teleportOnJoin;
              private double x, y, z;
              private float yaw, pitch;

              @Override
              public void onEnable() {
                  saveDefaultConfig();
                  loadSettings();
                  getServer().getPluginManager().registerEvents(this, this);
              }

              private void loadSettings() {
                  worldName = getConfig().getString("world", "hub2");
                  hunger = getConfig().getBoolean("hunger", true);
                  hearts = getConfig().getBoolean("hearts", true);
                  teleportOnJoin = getConfig().getBoolean("teleport-on-join", true);
                  x = getConfig().getDouble("spawn.x", 0.5);
                  y = getConfig().getDouble("spawn.y", 66.0);
                  z = getConfig().getDouble("spawn.z", -20.5);
                  yaw = (float) getConfig().getDouble("spawn.yaw", 0.0);
                  pitch = (float) getConfig().getDouble("spawn.pitch", 0.0);
              }

              private boolean isHub(Player player) {
                  return player.getWorld().getName().equals(worldName);
              }

              private Location spawn(Player player) {
                  World world = player.getWorld();
                  return new Location(world, x, y, z, yaw, pitch);
              }

              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)
              public void onFood(FoodLevelChangeEvent event) {
                  if (hunger && event.getEntity() instanceof Player player && isHub(player)) {
                      event.setCancelled(true);
                  }
              }

              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)
              public void onDamage(EntityDamageEvent event) {
                  if (hearts && event.getEntity() instanceof Player player && isHub(player)) {
                      event.setCancelled(true);
                  }
              }

              @EventHandler
              public void onWorldChange(PlayerChangedWorldEvent event) {
                  if (teleportOnJoin && isHub(event.getPlayer())) {
                      event.getPlayer().teleport(spawn(event.getPlayer()));
                  }
              }

              @EventHandler
              public void onJoin(PlayerJoinEvent event) {
                  Player player = event.getPlayer();
                  if (teleportOnJoin && isHub(player)) {
                      getServer().getScheduler().runTask(this, () -> {
                          if (player.isOnline() && isHub(player)) player.teleport(spawn(player));
                      });
                  }
              }
          }
          EOFHub2Protection

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Maven project
        run: |
          mkdir -p hub2protection/src/main/java/pl/reniferek/hub2protection

          cat > hub2protection/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>

            <groupId>pl.reniferek</groupId>
            <artifactId>Hub2Protection</artifactId>
            <version>1.0.0</version>

            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <release>21</release>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat > hub2protection/src/main/resources.yml <<'EOF'
          name: Hub2Protection
          version: 1.1.0
          main: pl.reniferek.hub2protection.Hub2Protection
          api-version: '1.21'
          author: Reniferek
          description: Hub2 protection and spawn teleport
          EOF

          mkdir -p hub2protection/src/main/resources
          mv hub2protection/src/main/resources.yml hub2protection/src/main/resources/plugin.yml

          cat > hub2protection/src/main/resources/config.yml <<'EOF'
          world: "hub2"
          hunger: true
          hearts: true
          teleport-on-join: true
          spawn:
            x: 0.5
            y: 66.0
            z: -20.5
            yaw: 0.0
            pitch: 0.0
          EOF

          cat > hub2protection/src/main/java/pl/reniferek/hub2protection/Hub2Protection.java <<'EOF'
          package pl.reniferek.hub2protection;

          import org.bukkit.Location;
          import org.bukkit.World;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.EventPriority;
          import org.bukkit.event.Listener;
          import org.bukkit.event.entity.FoodLevelChangeEvent;
          import org.bukkit.event.player.PlayerChangedWorldEvent;
          import org.bukkit.event.player.PlayerJoinEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          public final class Hub2Protection extends JavaPlugin implements Listener {

              private static final String WORLD_NAME = "hub2";

              private Location getHubSpawn(World world) {
                  return new Location(world, 0.5, 66.0, -20.5, 0.0f, 0.0f);
              }

              @Override
              public void onEnable() {
                  getServer().getPluginManager().registerEvents(this, this);
              }

              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)
              public void onFoodLevelChange(FoodLevelChangeEvent event) {
                  if (event.getEntity() instanceof Player player
                          && player.getWorld().getName().equals(WORLD_NAME)) {
                      event.setCancelled(true);
                  }
              }

              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)
              public void onDamage(EntityDamageEvent event) {
                  if (event.getEntity() instanceof Player player
                          && player.getWorld().getName().equals(WORLD_NAME)) {
                      event.setCancelled(true);
                  }
              }

              @EventHandler
              public void onWorldChange(PlayerChangedWorldEvent event) {
                  Player player = event.getPlayer();

                  if (player.getWorld().getName().equals(WORLD_NAME)) {
                      player.teleport(getHubSpawn(player.getWorld()));
                  }
              }

              @EventHandler
              public void onJoin(PlayerJoinEvent event) {
                  Player player = event.getPlayer();

                  if (player.getWorld().getName().equals(WORLD_NAME)) {
                      getServer().getScheduler().runTask(this, () ->
                              player.teleport(getHubSpawn(player.getWorld())));
                  }
              }
          }
          EOF

      - name: Build plugin
        working-directory: hub2protection
        run: mvn -B clean package

      - name: Copy JAR
        run: |
          mkdir -p output
          cp hub2protection/target/Hub2Protection-1.0.0.jar output/Hub2Protection.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Hub2Protection-JAR
          path: output/Hub2Protection.jar
