name: Build Hub2Protection

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create project
        run: |
          mkdir -p src/main/java/pl/hub2protection

          cat > pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">

            <modelVersion>4.0.0</modelVersion>

            <groupId>pl.hub2protection</groupId>
            <artifactId>Hub2Protection</artifactId>
            <version>1.4.0</version>

            <properties>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              <maven.compiler.release>21</maven.compiler.release>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <release>21</release>
                  </configuration>
                </plugin>

                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-jar-plugin</artifactId>
                  <version>3.4.2</version>
                  <configuration>
                    <archive>
                      <manifestEntries>
                        <paperweight-mappings-namespace>mojang</paperweight-mappings-namespace>
                      </manifestEntries>
                    </archive>
                  </configuration>
                </plugin>
              </plugins>
            </build>

          </project>
          EOF

          cat > src/main/java/pl/hub2protection/Hub2Protection.java <<'EOF'
          package pl.hub2protection;

          import org.bukkit.GameMode;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.block.Block;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.EventPriority;
          import org.bukkit.event.Listener;
          import org.bukkit.event.block.Action;
          import org.bukkit.event.entity.EntityDamageEvent;
          import org.bukkit.event.entity.FoodLevelChangeEvent;
          import org.bukkit.event.player.PlayerBedEnterEvent;
          import org.bukkit.event.player.PlayerInteractEvent;
          import org.bukkit.event.player.PlayerJoinEvent;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          public final class Hub2Protection extends JavaPlugin implements Listener {

              private Location spawn;

              @Override
              public void onEnable() {
                  spawn = new Location(
                          getServer().getWorlds().get(0),
                          0.5,
                          66.0,
                          -20.5,
                          0.0f,
                          0.0f
                  );

                  getServer().getPluginManager().registerEvents(this, this);
              }

              @EventHandler(priority = EventPriority.HIGHEST)
              public void onJoin(PlayerJoinEvent event) {
                  Player player = event.getPlayer();

                  if (player.getGameMode() != GameMode.ADVENTURE) {
                      player.setGameMode(GameMode.ADVENTURE);
                  }

                  player.teleport(spawn);
              }

              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onDamage(EntityDamageEvent event) {
                  if (event.getEntity() instanceof Player) {
                      event.setCancelled(true);
                  }
              }

              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onFood(FoodLevelChangeEvent event) {
                  if (event.getEntity() instanceof Player) {
                      event.setCancelled(true);
                  }
              }

              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onInteract(PlayerInteractEvent event) {
                  Action action = event.getAction();

                  if (action != Action.RIGHT_CLICK_BLOCK &&
                      action != Action.LEFT_CLICK_BLOCK) {
                      return;
                  }

                  Block block = event.getClickedBlock();

                  if (block == null) {
                      return;
                  }

                  Material type = block.getType();

                  if (type.name().endsWith("_BED")) {
                      event.setCancelled(true);
                  }
              }

              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onBedEnter(PlayerBedEnterEvent event) {
                  event.setCancelled(true);
              }

              @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
              public void onMove(PlayerMoveEvent event) {
                  if (!event.hasChangedBlock()) {
                      return;
                  }

                  if (event.getTo() == null) {
                      return;
                  }

                  if (event.getTo().getBlockY() <= -10) {
                      event.getPlayer().teleport(spawn);
                  }
              }
          }
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: Hub2Protection
          version: 1.4.0
          main: pl.hub2protection.Hub2Protection
          api-version: '1.21'
          description: Lightweight protection plugin for Hub2
          author: Hub2
          EOF

      - name: Build
        run: mvn -B package --no-transfer-progress

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp target/Hub2Protection-1.4.0.jar release/Hub2Protection.jar
          cd release
          zip ../Hub2Protection.zip Hub2Protection.jar

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Hub2Protection
          path: Hub2Protection.zip
