name: Build HubLogin

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Utwórz projekt
        shell: bash
        run: |
          mkdir -p src/main/java/pl/hublogin
          mkdir -p src/main/resources

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>

            <groupId>pl.hublogin</groupId>
            <artifactId>HubLogin</artifactId>
            <version>1.0.0</version>

            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <release>21</release>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: HubLogin
          version: 1.0.0
          main: pl.hublogin.HubLogin
          api-version: '1.21'

          commands:
            zaloguj:
              description: Logowanie na hubie
              usage: /zaloguj <hasło>

            zarejestruj:
              description: Rejestracja na hubie
              usage: /zarejestruj <hasło> <hasło>

            wyjerestruj:
              description: Wyrejestrowanie konta
              usage: /wyjerestruj <hasło>
          EOF

          cat > src/main/java/pl/hublogin/HubLogin.java <<'EOF'
          package pl.hublogin;

          import org.bukkit.Location;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.EventPriority;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerJoinEvent;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.event.player.PlayerQuitEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.security.MessageDigest;
          import java.util.Base64;
          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          public final class HubLogin extends JavaPlugin implements Listener {

              private final Set<UUID> logged = new HashSet<>();

              private Path players;
              private Path data;

              @Override
              public void onEnable() {
                  players = getDataFolder().toPath().resolve("gracze");
                  data = getDataFolder().toPath().resolve("dane");

                  try {
                      Files.createDirectories(players);
                      Files.createDirectories(data);
                  } catch (Exception e) {
                      getLogger().severe("Nie można utworzyć folderów HubLogin.");
                  }

                  getServer().getPluginManager().registerEvents(this, this);

                  getCommand("zaloguj").setExecutor((sender, command, label, args) -> {
                      if (!(sender instanceof Player player)) return true;

                      if (args.length != 1) {
                          player.sendMessage("§cUżyj: /zaloguj <hasło>");
                          return true;
                      }

                      login(player, args[0]);
                      return true;
                  });

                  getCommand("zarejestruj").setExecutor((sender, command, label, args) -> {
                      if (!(sender instanceof Player player)) return true;

                      if (args.length != 2) {
                          player.sendMessage("§cUżyj: /zarejestruj <hasło> <hasło>");
                          return true;
                      }

                      register(player, args[0], args[1]);
                      return true;
                  });

                  getCommand("wyjerestruj").setExecutor((sender, command, label, args) -> {
                      if (!(sender instanceof Player player)) return true;

                      if (args.length != 1) {
                          player.sendMessage("§cUżyj: /wyjerestruj <hasło>");
                          return true;
                      }

                      unregister(player, args[0]);
                      return true;
                  });
              }

              @Override
              public void onDisable() {
                  logged.clear();
              }

              @EventHandler
              public void onJoin(PlayerJoinEvent event) {
                  Player player = event.getPlayer();

                  logged.remove(player.getUniqueId());

                  try {
                      createPlayerFile(player);

                      if (Files.exists(passwordFile(player))) {
                          player.sendMessage("§eUżyj: §f/zaloguj <hasło>");
                      } else {
                          player.sendMessage("§eUżyj: §f/zarejestruj <hasło> <hasło>");
                      }
                  } catch (Exception e) {
                      getLogger().warning("Błąd danych gracza " + player.getName());
                  }
              }

              /*
               * Jedyny event wykonywany podczas próby ruchu.
               * Nie ma timerów, schedulerów ani żadnych pętli.
               *
               * Obrót głowy działa normalnie.
               * Blokowana jest tylko rzeczywista zmiana pozycji.
               */
              @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)
              public void onMove(PlayerMoveEvent event) {
                  Player player = event.getPlayer();

                  if (logged.contains(player.getUniqueId())) {
                      return;
                  }

                  Location from = event.getFrom();
                  Location to = event.getTo();

                  if (to == null) {
                      return;
                  }

                  if (from.getX() == to.getX()
                          && from.getY() == to.getY()
                          && from.getZ() == to.getZ()) {
                      return;
                  }

                  event.setTo(from);
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent event) {
                  logged.remove(event.getPlayer().getUniqueId());
              }

              private void register(Player player, String password, String confirm) {
                  try {
                      if (Files.exists(passwordFile(player))) {
                          player.sendMessage("§cKonto jest już zarejestrowane.");
                          return;
                      }

                      if (password.length() < 4) {
                          player.sendMessage("§cHasło musi mieć minimum 4 znaki.");
                          return;
                      }

                      if (!password.equals(confirm)) {
                          player.sendMessage("§cHasła nie są takie same.");
                          return;
                      }

                      Files.writeString(
                              passwordFile(player),
                              "hash: " + hash(password) + "\n" +
                              "length: " + password.length() + "\n",
                              StandardCharsets.UTF_8
                      );

                      update(player, "Konto", "zajęte");
                      update(player, "Pokaż hasło", "false");
                      update(player, "Hasło", stars(password.length()));

                      logged.add(player.getUniqueId());

                      player.sendMessage("§aKonto zostało zarejestrowane.");
                  } catch (Exception e) {
                      player.sendMessage("§cNie udało się zapisać konta.");
                  }
              }

              private void login(Player player, String password) {
                  try {
                      Path file = passwordFile(player);

                      if (!Files.exists(file)) {
                          player.sendMessage("§cNie masz jeszcze konta.");
                          player.sendMessage("§eUżyj: §f/zarejestruj <hasło> <hasło>");
                          return;
                      }

                      String stored = value(
                              Files.readString(file, StandardCharsets.UTF_8),
                              "hash"
                      );

                      if (!hash(password).equals(stored)) {
                          player.sendMessage("§cNiepoprawne hasło.");
                          incrementInvalid(player);
                          return;
                      }

                      logged.add(player.getUniqueId());

                      player.sendMessage("§aZalogowano pomyślnie.");
                  } catch (Exception e) {
                      player.sendMessage("§cNie udało się odczytać konta.");
                  }
              }

              private void unregister(Player player, String password) {
                  try {
                      Path file = passwordFile(player);

                      if (!Files.exists(file)) {
                          player.sendMessage("§cKonto jest wolne.");
                          return;
                      }

                      String stored = value(
                              Files.readString(file, StandardCharsets.UTF_8),
                              "hash"
                      );

                      if (!hash(password).equals(stored)) {
                          player.sendMessage("§cNiepoprawne hasło.");
                          return;
                      }

                      Files.deleteIfExists(file);

                      logged.remove(player.getUniqueId());

                      update(player, "Konto", "wolne");
                      update(player, "Hasło", "brak");

                      player.sendMessage("§aKonto zostało wyrejestrowane.");
                      player.sendMessage("§eUżyj: §f/zarejestruj <hasło> <hasło>");
                  } catch (Exception e) {
                      player.sendMessage("§cNie udało się wyrejestrować konta.");
                  }
              }

              private void createPlayerFile(Player player) throws Exception {
                  Path file = playerFile(player);

                  if (Files.exists(file)) {
                      return;
                  }

                  String ip = player.getAddress() == null
                          ? "*"
                          : player.getAddress().getAddress().getHostAddress();

                  Files.writeString(
                          file,
                          "Nick: " + player.getName() + "\n" +
                          "Konto: wolne\n" +
                          "Pokaż ip: true\n" +
                          "IP gracza: " + ip + "\n" +
                          "gracz ma: " +
                          (getServer().getOnlineMode() ? "premium" : "no premium") + "\n" +
                          "Logowanie ip: false\n" +
                          "Pokaż hasło: false\n" +
                          "Hasło: brak\n" +
                          "Data dołączenia: teraz\n" +
                          "Data logowania: brak\n" +
                          "Czas gry: 0h 0m 0s\n" +
                          "Ostatnie logowanie: brak\n" +
                          "Ile razy gracz się zalogował: 0\n" +
                          "Ile razy gracz wpisał niepoprawne hasło: 0\n",
                          StandardCharsets.UTF_8
                  );
              }

              private void update(Player player, String key, String value) throws Exception {
                  Path file = playerFile(player);
                  String text = Files.readString(file, StandardCharsets.UTF_8);

                  String[] lines = text.split("\\R", -1);

                  for (int i = 0; i < lines.length; i++) {
                      if (lines[i].startsWith(key + ":")) {
                          lines[i] = key + ": " + value;
                          break;
                      }
                  }

                  Files.writeString(
                          file,
                          String.join("\n", lines),
                          StandardCharsets.UTF_8
                  );
              }

              private void incrementInvalid(Player player) {
                  try {
                      Path file = playerFile(player);
                      String text = Files.readString(file, StandardCharsets.UTF_8);

                      String old = value(text, "Ile razy gracz wpisał niepoprawne hasło");

                      int number;

                      try {
                          number = Integer.parseInt(old);
                      } catch (Exception e) {
                          number = 0;
                      }

                      update(player,
                              "Ile razy gracz wpisał niepoprawne hasło",
                              String.valueOf(number + 1));
                  } catch (Exception ignored) {
                  }
              }

              private Path playerFile(Player player) {
                  return players.resolve(player.getName() + ".yml");
              }

              private Path passwordFile(Player player) {
                  return data.resolve(player.getUniqueId() + ".yml");
              }

              private static String value(String text, String key) {
                  for (String line : text.split("\\R")) {
                      if (line.startsWith(key + ": ")) {
                          return line.substring(key.length() + 2).trim();
                      }
                  }

                  return "";
              }

              private static String hash(String password) throws Exception {
                  MessageDigest digest = MessageDigest.getInstance("SHA-256");

                  return Base64.getEncoder().encodeToString(
                          digest.digest(password.getBytes(StandardCharsets.UTF_8))
                  );
              }

              private static String stars(int length) {
                  return "*".repeat(Math.max(0, length));
              }
          }
          EOF

      - name: Zbuduj plugin
        run: mvn -q package

      - name: Udostępnij JAR
        uses: actions/upload-artifact@v4
        with:
          name: HubLogin
          path: target/HubLogin-*.jar
