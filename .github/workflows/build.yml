name: Build HologramPlugin

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          mkdir -p src/main/java/pl/reniferek/hologram
          mkdir -p src/main/resources

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>pl.reniferek</groupId>
            <artifactId>HologramPlugin</artifactId>
            <version>2.0.0</version>

            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <release>21</release>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: HologramPlugin
          version: 2.0.0
          main: pl.reniferek.hologram.HologramPlugin
          api-version: '1.21'
          author: Reniferek
          description: Highly optimized TextDisplay holograms
          commands:
            hologram:
              aliases: [holo]
              description: Hologram management
              usage: /hologram
              permission: hologram.admin
          permissions:
            hologram.admin:
              default: op
          EOF

          cat > src/main/resources/config.yml <<'EOF'
          line-width: 100000
          shadow: false
          see-through: true
          default-size: 1.0
          default-odstep: 1.0
          portal-visibility-check: false
          EOF

          cat > src/main/java/pl/reniferek/hologram/HologramPlugin.java <<'EOF'
          package pl.reniferek.hologram;

          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.TextDecoration;
          import net.kyori.adventure.text.serializer.legacy.LegacyComponentSerializer;
          import org.bukkit.Bukkit;
          import org.bukkit.ChatColor;
          import org.bukkit.Location;
          import org.bukkit.World;
          import org.bukkit.command.*;
          import org.bukkit.entity.Display;
          import org.bukkit.entity.Player;
          import org.bukkit.entity.TextDisplay;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.EventPriority;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerJoinEvent;
          import org.bukkit.event.player.PlayerQuitEvent;
          import org.bukkit.plugin.java.JavaPlugin;
          import org.bukkit.plugin.messaging.PluginMessageListener;
          import org.bukkit.util.Transformation;
          import org.joml.Quaternionf;
          import org.joml.Vector3f;

          import java.io.File;
          import java.io.IOException;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.util.*;
          import java.util.concurrent.ConcurrentHashMap;

          public final class HologramPlugin extends JavaPlugin implements Listener, PluginMessageListener, TabCompleter {

              private static final String STATS_CHANNEL = "serverteleport:stats";
              private static final LegacyComponentSerializer LEGACY = LegacyComponentSerializer.legacyAmpersand();

              private final Map<Integer, HologramData> holograms = new HashMap<>();
              private final Map<Integer, List<TextDisplay>> sharedDisplays = new HashMap<>();
              private final Map<Integer, Map<UUID, List<TextDisplay>>> personalDisplays = new HashMap<>();
              private final Set<Integer> personalIds = new HashSet<>();
              private final Set<Integer> dynamicIds = new HashSet<>();

              private int lineWidth;
              private boolean shadow;
              private boolean seeThrough;
              private double defaultSize;
              private double defaultOdstep;
              private boolean portalVisibilityCheck;

              private int lifeOnline;
              private int lifeMax;
              private boolean lifeStatus;
              private boolean lifeBlockade;
              private boolean statsKnown;

              @Override
              public void onEnable() {
                  saveDefaultConfig();
                  loadSettings();

                  Bukkit.getPluginManager().registerEvents(this, this);
                  getCommand("hologram").setTabCompleter(this);

                  getServer().getMessenger().registerIncomingPluginChannel(this, STATS_CHANNEL, this);
                  getServer().getMessenger().registerOutgoingPluginChannel(this, STATS_CHANNEL);

                  loadAll();
                  rebuildIndexes();
                  spawnAll();

                  // One request per player join is enough. No repeating task is used.
                  for (Player player : Bukkit.getOnlinePlayers()) {
                      requestStats(player);
                  }
              }

              @Override
              public void onDisable() {
                  removeAllDisplays();
                  getServer().getMessenger().unregisterIncomingPluginChannel(this, STATS_CHANNEL);
                  getServer().getMessenger().unregisterOutgoingPluginChannel(this, STATS_CHANNEL);
              }

              private void loadSettings() {
                  lineWidth = Math.max(1, getConfig().getInt("line-width", 100000));
                  shadow = getConfig().getBoolean("shadow", false);
                  seeThrough = getConfig().getBoolean("see-through", true);
                  defaultSize = Math.max(0.01, getConfig().getDouble("default-size", 1.0));
                  defaultOdstep = Math.max(0.0, getConfig().getDouble("default-odstep", 1.0));
                  portalVisibilityCheck = getConfig().getBoolean("portal-visibility-check", false);
              }

              private File hologramRoot() {
                  return new File(getDataFolder(), "hologramy");
              }

              private void loadAll() {
                  holograms.clear();
                  File root = hologramRoot();
                  if (!root.exists() && !root.mkdirs()) return;

                  File[] dirs = root.listFiles(File::isDirectory);
                  if (dirs == null) return;

                  for (File dir : dirs) {
                      try {
                          int id = Integer.parseInt(dir.getName());
                          File data = new File(dir, "data.yml");
                          if (!data.isFile()) continue;
                          HologramData h = HologramData.load(data, id, defaultSize, defaultOdstep);
                          if (h != null) holograms.put(id, h);
                      } catch (NumberFormatException ignored) {
                      }
                  }
              }

              private void save(HologramData h) {
                  File dir = new File(hologramRoot(), String.valueOf(h.id));
                  if (!dir.exists()) dir.mkdirs();
                  try {
                      Files.writeString(new File(dir, "data.yml").toPath(), h.toYaml(), StandardCharsets.UTF_8);
                  } catch (IOException e) {
                      getLogger().warning("Nie można zapisać hologramu " + h.id + ": " + e.getMessage());
                  }
              }

              private void rebuildIndexes() {
                  personalIds.clear();
                  dynamicIds.clear();

                  for (HologramData h : holograms.values()) {
                      String all = h.allText();
                      if (all.contains("%player%")) personalIds.add(h.id);
                      if (containsDynamic(all)) dynamicIds.add(h.id);
                  }

                  syncPlaceholderSections();
              }

              private boolean containsDynamic(String text) {
                  return text.contains("%online%")
                          || text.contains("%online_LifeStealSMP%")
                          || text.contains("%status_LifeStealSMP%")
                          || text.contains("%blokada_LifeStealSMP%");
              }

              private void syncPlaceholderSections() {
                  for (HologramData h : holograms.values()) {
                      h.syncPlaceholderSections();
                      save(h);
                  }
              }

              private void spawnAll() {
                  removeAllDisplays();
                  for (HologramData h : holograms.values()) spawnHologram(h);
              }

              private void spawnHologram(HologramData h) {
                  if (personalIds.contains(h.id)) {
                      Map<UUID, List<TextDisplay>> viewers = new HashMap<>();
                      personalDisplays.put(h.id, viewers);
                      for (Player p : Bukkit.getOnlinePlayers()) {
                          viewers.put(p.getUniqueId(), createDisplays(h, p));
                      }
                  } else {
                      sharedDisplays.put(h.id, createDisplays(h, null));
                  }
              }

              private List<TextDisplay> createDisplays(HologramData h, Player viewer) {
                  List<TextDisplay> list = new ArrayList<>();
                  World world = Bukkit.getWorld(h.world);
                  if (world == null) return list;

                  double y = h.y;
                  for (Line line : h.lines) {
                      Location loc = new Location(world, h.x, y, h.z);
                      TextDisplay display = world.spawn(loc, TextDisplay.class, entity -> {
                          entity.setBillboard(Display.Billboard.VERTICAL);
                          entity.setShadowed(shadow);
                          entity.setSeeThrough(seeThrough);
                          entity.setLineWidth(lineWidth);
                          entity.setDefaultBackground(false);
                          entity.setTextOpacity((byte) -1);
                          entity.setPersistent(true);
                          entity.setVisibleByDefault(viewer == null);
                          applySize(entity, line.size);
                          entity.text(render(line.text, viewer));
                      });

                      if (viewer != null) {
                          viewer.showEntity(this, display);
                      }

                      list.add(display);
                      y -= line.odstep;
                  }
                  return list;
              }

              private void applySize(TextDisplay display, double size) {
                  float s = (float) Math.max(0.01, size);
                  Transformation old = display.getTransformation();
                  display.setTransformation(new Transformation(
                          old.getTranslation(),
                          old.getLeftRotation(),
                          new Vector3f(s, s, s),
                          old.getRightRotation()
                  ));
              }

              private Component render(String input, Player viewer) {
                  String s = input == null ? "" : input;

                  if (viewer != null) {
                      s = s.replace("%player%", viewer.getName());
                  }

                  s = s.replace("%online%", formatOnline(lifeOnline, lifeMax, null));
                  s = s.replace("%online_LifeStealSMP%", formatOnline(lifeOnline, lifeMax, "%online_LifeStealSMP%"));

                  String status = lifeStatus ? statusText(true) : statusText(false);
                  String blockade = lifeBlockade ? blockadeText(true) : blockadeText(false);

                  s = s.replace("%status_LifeStealSMP%", status);
                  s = s.replace("%blokada_LifeStealSMP%", blockade);

                  s = ChatColor.translateAlternateColorCodes('&', s);
                  return Component.text(s).decoration(TextDecoration.ITALIC, false);
              }

              private String statusText(boolean enabled) {
                  // Placeholder-specific configuration belongs to the hologram.
                  // The caller of render gets the hologram only through refreshHologram,
                  // so this fallback is replaced there with per-hologram text.
                  return enabled ? "&aWłączony" : "&4Wyłączony";
              }

              private String blockadeText(boolean open) {
                  return open ? "&aOtwarty" : "&4Zablokowany";
              }

              private String formatOnline(int online, int max, String placeholder) {
                  // This is only a fallback. Per-hologram templates are applied in renderLine().
                  return ChatColor.WHITE + online + ChatColor.WHITE + "/" + ChatColor.WHITE + max;
              }

              private Component renderLine(HologramData h, String input, Player viewer) {
                  String s = input == null ? "" : input;

                  if (viewer != null) s = s.replace("%player%", viewer.getName());

                  if (s.contains("%online_LifeStealSMP%")) {
                      s = s.replace("%online_LifeStealSMP%", h.onlineValue("%online_LifeStealSMP%", lifeOnline, lifeMax));
                  }
                  if (s.contains("%online%")) {
                      s = s.replace("%online%", h.onlineValue("%online%", getServer().getOnlinePlayers().size(), getServer().getMaxPlayers()));
                  }
                  if (s.contains("%status_LifeStealSMP%")) {
                      s = s.replace("%status_LifeStealSMP%", h.statusValue("%status_LifeStealSMP%", lifeStatus));
                  }
                  if (s.contains("%blokada_LifeStealSMP%")) {
                      s = s.replace("%blokada_LifeStealSMP%", h.blockadeValue("%blokada_LifeStealSMP%", lifeBlockade));
                  }

                  s = ChatColor.translateAlternateColorCodes('&', s);
                  return Component.text(s).decoration(TextDecoration.ITALIC, false);
              }

              private void refreshHologram(int id) {
                  HologramData h = holograms.get(id);
                  if (h == null) return;

                  if (personalIds.contains(id)) {
                      Map<UUID, List<TextDisplay>> viewers = personalDisplays.computeIfAbsent(id, k -> new HashMap<>());
                      for (Player p : Bukkit.getOnlinePlayers()) {
                          List<TextDisplay> list = viewers.get(p.getUniqueId());
                          if (list == null || list.size() != h.lines.size()) {
                              removeList(list);
                              list = createDisplays(h, p);
                              viewers.put(p.getUniqueId(), list);
                          }
                          updateList(h, list, p);
                      }
                  } else {
                      List<TextDisplay> list = sharedDisplays.get(id);
                      if (list == null || list.size() != h.lines.size()) {
                          removeList(list);
                          list = createDisplays(h, null);
                          sharedDisplays.put(id, list);
                      }
                      updateList(h, list, null);
                  }
              }

              private void updateList(HologramData h, List<TextDisplay> displays, Player viewer) {
                  if (displays == null) return;
                  for (int i = 0; i < displays.size() && i < h.lines.size(); i++) {
                      Line line = h.lines.get(i);
                      TextDisplay d = displays.get(i);
                      if (!d.isValid()) continue;
                      d.text(renderLine(h, line.text, viewer));
                      applySize(d, line.size);
                  }
              }

              private void refreshDynamic() {
                  for (Integer id : dynamicIds) refreshHologram(id);
              }

              private void refreshLocalOnlineOnly() {
                  for (Integer id : dynamicIds) {
                      HologramData h = holograms.get(id);
                      if (h != null && h.allText().contains("%online%")) refreshHologram(id);
                  }
              }

              private void requestStats(Player player) {
                  if (!player.isOnline()) return;
                  byte[] data = "REQUEST".getBytes(StandardCharsets.UTF_8);
                  player.sendPluginMessage(this, STATS_CHANNEL, data);
              }

              @Override
              public void onPluginMessageReceived(String channel, Player player, byte[] message) {
                  if (!STATS_CHANNEL.equals(channel) || message.length < 5) return;

                  try {
                      java.io.DataInputStream in = new java.io.DataInputStream(new java.io.ByteArrayInputStream(message));
                      String type = in.readUTF();

                      if ("STATS".equals(type)) {
                          int online = in.readInt();
                          int max = in.readInt();
                          boolean status = in.readBoolean();
                          boolean blockade = in.readBoolean();

                          boolean changed = !statsKnown
                                  || lifeOnline != online
                                  || lifeMax != max
                                  || lifeStatus != status
                                  || lifeBlockade != blockade;

                          lifeOnline = online;
                          lifeMax = max;
                          lifeStatus = status;
                          lifeBlockade = blockade;
                          statsKnown = true;

                          if (changed) refreshDynamic();
                      }
                  } catch (IOException ignored) {
                  }
              }

              @EventHandler(priority = EventPriority.MONITOR)
              public void onJoin(PlayerJoinEvent event) {
                  Player p = event.getPlayer();

                  for (Integer id : personalIds) {
                      HologramData h = holograms.get(id);
                      if (h == null) continue;
                      Map<UUID, List<TextDisplay>> map = personalDisplays.computeIfAbsent(id, k -> new HashMap<>());
                      removeList(map.put(p.getUniqueId(), createDisplays(h, p)));
                  }

                  Bukkit.getScheduler().runTaskLater(this, () -> {
                      requestStats(p);
                      refreshLocalOnlineOnly();
                  }, 1L);
              }

              @EventHandler(priority = EventPriority.MONITOR)
              public void onQuit(PlayerQuitEvent event) {
                  UUID uuid = event.getPlayer().getUniqueId();
                  for (Map<UUID, List<TextDisplay>> map : personalDisplays.values()) {
                      removeList(map.remove(uuid));
                  }
                  Bukkit.getScheduler().runTask(this, this::refreshLocalOnlineOnly);
              }

              private void removeAllDisplays() {
                  for (List<TextDisplay> list : sharedDisplays.values()) removeList(list);
                  sharedDisplays.clear();

                  for (Map<UUID, List<TextDisplay>> map : personalDisplays.values()) {
                      for (List<TextDisplay> list : map.values()) removeList(list);
                  }
                  personalDisplays.clear();
              }

              private void removeList(List<TextDisplay> list) {
                  if (list == null) return;
                  for (TextDisplay d : list) {
                      if (d != null && d.isValid()) d.remove();
                  }
              }

              private void saveAndReload() {
                  loadSettings();
                  loadAll();
                  rebuildIndexes();
                  spawnAll();
              }

              private int nextId() {
                  int id = 1;
                  while (holograms.containsKey(id)) id++;
                  return id;
              }

              private boolean canUse(CommandSender sender) {
                  return sender.hasPermission("hologram.admin");
              }

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  if (!canUse(sender)) {
                      sender.sendMessage(color("&cBrak uprawnień."));
                      return true;
                  }

                  if (args.length == 0) {
                      sender.sendMessage(color("&e/hologram stworz"));
                      sender.sendMessage(color("&e/hologram wybierz <id> zmien_nazwe <linia> <tekst>"));
                      sender.sendMessage(color("&e/hologram wybierz <id> dodaj_linijke <tekst>"));
                      sender.sendMessage(color("&e/hologram wybierz <id> przesun"));
                      sender.sendMessage(color("&e/hologram usun <id> linijka <linia>"));
                      sender.sendMessage(color("&e/hologram usun <id>"));
                      sender.sendMessage(color("&e/hologram reload"));
                      sender.sendMessage(color("&e/hologram list [id]"));
                      return true;
                  }

                  String sub = args[0].toLowerCase(Locale.ROOT);

                  if (sub.equals("stworz") || sub.equals("stwor") || sub.equals("stwórz")) {
                      if (!(sender instanceof Player p)) return true;

                      int id = nextId();
                      Location l = p.getLocation();
                      HologramData h = new HologramData(id, p.getWorld().getName(), Math.floor(l.getX()) + 0.5, l.getY(), Math.floor(l.getZ()) + 0.5);
                      h.lines.add(new Line("&fID: " + id, defaultSize, defaultOdstep));
                      h.syncPlaceholderSections();
                      holograms.put(id, h);
                      save(h);
                      rebuildIndexes();
                      spawnHologram(h);

                      p.sendMessage(color("&aUtworzono hologram ID: &f" + id));
                      return true;
                  }

                  if (sub.equals("reload")) {
                      saveAll();
                      saveConfig();
                      saveAndReload();
                      sender.sendMessage(color("&aHologramy przeładowane."));
                      return true;
                  }

                  if (sub.equals("list")) {
                      if (args.length == 1) {
                          if (holograms.isEmpty()) {
                              sender.sendMessage(color("&7Brak hologramów."));
                              return true;
                          }
                          sender.sendMessage(color("&eHologramy:"));
                          for (HologramData h : holograms.values()) {
                              sender.sendMessage(color("&7- &f" + h.id + " &7(" + h.lines.size() + " linii)"));
                          }
                          return true;
                      }

                      Integer id = parseId(args[1]);
                      if (id == null || !holograms.containsKey(id)) {
                          sender.sendMessage(color("&cNie ma takiego hologramu."));
                          return true;
                      }
                      HologramData h = holograms.get(id);
                      sender.sendMessage(color("&eHologram &f" + id));
                      sender.sendMessage(color("&7World: &f" + h.world));
                      sender.sendMessage(color("&7XYZ: &f" + h.x + " " + h.y + " " + h.z));
                      for (int i = 0; i < h.lines.size(); i++) {
                          Line line = h.lines.get(i);
                          sender.sendMessage(color("&7" + (i + 1) + ". &f" + line.text + " &7(size=" + line.size + ", odstęp=" + line.odstep + ")"));
                      }
                      return true;
                  }

                  if (sub.equals("usun")) {
                      if (args.length < 2) return true;
                      Integer id = parseId(args[1]);
                      if (id == null || !holograms.containsKey(id)) {
                          sender.sendMessage(color("&cNie ma takiego hologramu."));
                          return true;
                      }

                      if (args.length >= 4 && args[2].equalsIgnoreCase("linijka")) {
                          Integer lineNo = parsePositive(args[3]);
                          HologramData h = holograms.get(id);
                          if (lineNo == null || lineNo < 1 || lineNo > h.lines.size()) {
                              sender.sendMessage(color("&cNie ma takiej linii."));
                              return true;
                          }
                          h.lines.remove((int) lineNo - 1);
                          h.syncPlaceholderSections();
                          save(h);
                          rebuildIndexes();
                          spawnAll();
                          sender.sendMessage(color("&aUsunięto linię."));
                          return true;
                      }

                      HologramData h = holograms.remove(id);
                      removeList(sharedDisplays.remove(id));
                      Map<UUID, List<TextDisplay>> map = personalDisplays.remove(id);
                      if (map != null) for (List<TextDisplay> list : map.values()) removeList(list);

                      File dir = new File(hologramRoot(), String.valueOf(id));
                      deleteRecursively(dir);
                      rebuildIndexes();
                      sender.sendMessage(color("&aUsunięto hologram ID: &f" + id));
                      return true;
                  }

                  if (sub.equals("wybierz")) {
                      if (args.length < 3) return true;
                      Integer id = parseId(args[1]);
                      HologramData h = id == null ? null : holograms.get(id);
                      if (h == null) {
                          sender.sendMessage(color("&cNie ma takiego hologramu."));
                          return true;
                      }

                      String action = args[2].toLowerCase(Locale.ROOT);

                      if (action.equals("przesun")) {
                          if (!(sender instanceof Player p)) return true;
                          Location l = p.getLocation();
                          h.world = p.getWorld().getName();
                          h.x = Math.floor(l.getX()) + 0.5;
                          h.y = l.getY();
                          h.z = Math.floor(l.getZ()) + 0.5;
                          save(h);
                          spawnAll();
                          sender.sendMessage(color("&aPrzesunięto hologram."));
                          return true;
                      }

                      if (action.equals("dodaj_linijke") || action.equals("dodaj_linie") || action.equals("dodaj")) {
                          if (args.length < 4) return true;
                          String text = join(args, 3);
                          h.lines.add(new Line(text, defaultSize, defaultOdstep));
                          h.syncPlaceholderSections();
                          save(h);
                          rebuildIndexes();
                          spawnAll();
                          sender.sendMessage(color("&aDodano linię."));
                          return true;
                      }

                      if (action.equals("zmien_nazwe") || action.equals("zmien_linie") || action.equals("zmien")) {
                          if (args.length < 5) return true;
                          Integer lineNo = parsePositive(args[3]);
                          if (lineNo == null || lineNo < 1 || lineNo > h.lines.size()) {
                              sender.sendMessage(color("&cNie ma takiej linii."));
                              return true;
                          }
                          h.lines.get(lineNo - 1).text = join(args, 4);
                          h.syncPlaceholderSections();
                          save(h);
                          rebuildIndexes();
                          spawnAll();
                          sender.sendMessage(color("&aZmieniono linię."));
                          return true;
                      }

                      return true;
                  }

                  Integer directId = parseId(args[0]);
                  if (directId != null && holograms.containsKey(directId)) {
                      HologramData h = holograms.get(directId);
                      sender.sendMessage(color("&eHologram &f" + directId + " &7ma &f" + h.lines.size() + " &7linii."));
                      return true;
                  }

                  return true;
              }

              private void saveAll() {
                  for (HologramData h : holograms.values()) save(h);
              }

              private String join(String[] a, int start) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = start; i < a.length; i++) {
                      if (i > start) sb.append(' ');
                      sb.append(a[i]);
                  }
                  return sb.toString();
              }

              private Integer parseId(String s) {
                  try { return Integer.parseInt(s); } catch (Exception e) { return null; }
              }

              private Integer parsePositive(String s) {
                  try {
                      int i = Integer.parseInt(s);
                      return i > 0 ? i : null;
                  } catch (Exception e) {
                      return null;
                  }
              }

              private String color(String s) {
                  return ChatColor.translateAlternateColorCodes('&', s);
              }

              private void deleteRecursively(File f) {
                  if (f == null || !f.exists()) return;
                  if (f.isDirectory()) {
                      File[] files = f.listFiles();
                      if (files != null) for (File child : files) deleteRecursively(child);
                  }
                  f.delete();
              }

              @Override
              public List<String> onTabComplete(CommandSender sender, Command command, String alias, String[] args) {
                  if (!canUse(sender)) return Collections.emptyList();

                  if (args.length == 1) {
                      // Root intentionally does not suggest hologram IDs.
                      return filter(args[0], List.of("stworz", "stwor", "stwórz", "wybierz", "usun", "reload", "list", "help"));
                  }

                  if (args[0].equalsIgnoreCase("list") || args[0].equalsIgnoreCase("wybierz") || args[0].equalsIgnoreCase("usun")) {
                      if (args.length == 2) {
                          List<String> ids = new ArrayList<>();
                          for (Integer id : holograms.keySet()) ids.add(String.valueOf(id));
                          return filter(args[1], ids);
                      }
                  }

                  if (args[0].equalsIgnoreCase("wybierz") && args.length == 3) {
                      return filter(args[2], List.of("zmien_nazwe", "dodaj_linijke", "przesun"));
                  }

                  if (args[0].equalsIgnoreCase("usun") && args.length == 3) {
                      return filter(args[2], List.of("linijka"));
                  }

                  return Collections.emptyList();
              }

              private List<String> filter(String typed, Collection<String> values) {
                  String t = typed.toLowerCase(Locale.ROOT);
                  List<String> out = new ArrayList<>();
                  for (String v : values) if (v.toLowerCase(Locale.ROOT).startsWith(t)) out.add(v);
                  return out;
              }

              private static final class Line {
                  String text;
                  double size;
                  double odstep;

                  Line(String text, double size, double odstep) {
                      this.text = text;
                      this.size = size;
                      this.odstep = odstep;
                  }
              }

              private static final class HologramData {
                  final int id;
                  String world;
                  double x, y, z;
                  final List<Line> lines = new ArrayList<>();

                  // Placeholder-specific templates. Only used placeholders are kept.
                  final Map<String, Map<String, String>> placeholders = new LinkedHashMap<>();

                  HologramData(int id, String world, double x, double y, double z) {
                      this.id = id;
                      this.world = world;
                      this.x = x;
                      this.y = y;
                      this.z = z;
                  }

                  String allText() {
                      StringBuilder sb = new StringBuilder();
                      for (Line l : lines) sb.append(l.text).append('\n');
                      return sb.toString();
                  }

                  void syncPlaceholderSections() {
                      Set<String> used = new LinkedHashSet<>();
                      String text = allText();

                      if (text.contains("%online%")) used.add("%online%");
                      if (text.contains("%online_LifeStealSMP%")) used.add("%online_LifeStealSMP%");
                      if (text.contains("%status_LifeStealSMP%")) used.add("%status_LifeStealSMP%");
                      if (text.contains("%blokada_LifeStealSMP%")) used.add("%blokada_LifeStealSMP%");

                      placeholders.keySet().removeIf(k -> !used.contains(k));

                      for (String key : used) {
                          if (placeholders.containsKey(key)) continue;
                          Map<String, String> map = new LinkedHashMap<>();

                          if (key.equals("%status_LifeStealSMP%")) {
                              map.put("włączony", "&aWłączony");
                              map.put("wyłączony", "&4Wyłączony");
                          } else if (key.equals("%blokada_LifeStealSMP%")) {
                              map.put("otwarty", "&aOtwarty");
                              map.put("zablokowany", "&4Zablokowany");
                          } else {
                              map.put("osoby", "&f0");
                              map.put("ukośnik", "&f/");
                              map.put("miejsce", "&f20");
                          }

                          placeholders.put(key, map);
                      }
                  }

                  String statusValue(String key, boolean enabled) {
                      Map<String, String> m = placeholders.get(key);
                      if (m == null) return enabled ? "&aWłączony" : "&4Wyłączony";
                      return enabled ? m.getOrDefault("włączony", "&aWłączony") : m.getOrDefault("wyłączony", "&4Wyłączony");
                  }

                  String blockadeValue(String key, boolean open) {
                      Map<String, String> m = placeholders.get(key);
                      if (m == null) return open ? "&aOtwarty" : "&4Zablokowany";
                      return open ? m.getOrDefault("otwarty", "&aOtwarty") : m.getOrDefault("zablokowany", m.getOrDefault("zamkniety", "&4Zablokowany"));
                  }

                  String onlineValue(String key, int online, int max) {
                      Map<String, String> m = placeholders.get(key);
                      if (m == null) return "&f" + online + "&f/&f" + max;

                      String osoby = m.getOrDefault("osoby", "&f0");
                      String slash = m.getOrDefault("ukośnik", "&f/");
                      String miejsce = m.getOrDefault("miejsce", "&f20");

                      osoby = replaceLastNumber(osoby, online);
                      miejsce = replaceLastNumber(miejsce, max);
                      return osoby + slash + miejsce;
                  }

                  private String replaceLastNumber(String template, int number) {
                      if (template == null) return String.valueOf(number);
                      int end = template.length();
                      int i = end - 1;
                      while (i >= 0 && Character.isDigit(template.charAt(i))) i--;
                      if (i < end - 1) {
                          return template.substring(0, i + 1) + number + template.substring(end);
                      }
                      return template + number;
                  }

                  String toYaml() {
                      StringBuilder s = new StringBuilder();
                      s.append("world: \"").append(escape(world)).append("\"\\n");
                      s.append("x: ").append(x).append("\\n");
                      s.append("y: ").append(y).append("\\n");
                      s.append("z: ").append(z).append("\\n");
                      s.append("widzialnosc_przez_portal: false\\n");
                      s.append("lines:\\n");
                      for (Line l : lines) {
                          s.append("  - text: \"").append(escape(l.text)).append("\"\\n");
                          s.append("    size: ").append(l.size).append("\\n");
                          s.append("    odstęp: ").append(l.odstep).append("\\n");
                      }

                      if (!placeholders.isEmpty()) {
                          s.append("placeholders:\\n");
                          for (Map.Entry<String, Map<String, String>> e : placeholders.entrySet()) {
                              s.append("  \"").append(escape(e.getKey())).append("\":\\n");
                              for (Map.Entry<String, String> p : e.getValue().entrySet()) {
                                  s.append("    \"").append(escape(p.getKey())).append("\": \"").append(escape(p.getValue())).append("\"\\n");
                              }
                          }
                      }
                      return s.toString();
                  }

                  static HologramData load(File file, int id, double defaultSize, double defaultOdstep) {
                      try {
                          List<String> lines = Files.readAllLines(file.toPath(), StandardCharsets.UTF_8);
                          String world = "world";
                          double x = 0.5, y = 64, z = 0.5;
                          boolean portal = false;

                          for (String raw : lines) {
                              String line = raw.trim();
                              if (line.startsWith("world:")) world = unquote(line.substring(6).trim());
                              else if (line.startsWith("x:")) x = parseDouble(line.substring(2).trim(), x);
                              else if (line.startsWith("y:")) y = parseDouble(line.substring(2).trim(), y);
                              else if (line.startsWith("z:")) z = parseDouble(line.substring(2).trim(), z);
                              else if (line.startsWith("widzialnosc_przez_portal:")) portal = Boolean.parseBoolean(line.substring(line.indexOf(':') + 1).trim());
                          }

                          HologramData h = new HologramData(id, world, x, y, z);

                          boolean inLines = false;
                          Line current = null;
                          boolean inPlaceholders = false;
                          String currentPlaceholder = null;

                          for (String raw : lines) {
                              String t = raw.trim();

                              if (t.equals("lines:")) {
                                  inLines = true;
                                  inPlaceholders = false;
                                  continue;
                              }
                              if (t.equals("placeholders:")) {
                                  inPlaceholders = true;
                                  inLines = false;
                                  continue;
                              }

                              if (inLines) {
                                  if (t.startsWith("- text:")) {
                                      String text = unquote(t.substring(t.indexOf(':') + 1).trim());
                                      current = new Line(text, defaultSize, defaultOdstep);
                                      h.lines.add(current);
                                  } else if (current != null && t.startsWith("size:")) {
                                      current.size = parseDouble(t.substring(5).trim(), defaultSize);
                                  } else if (current != null && (t.startsWith("odstęp:") || t.startsWith("odstep:"))) {
                                      current.odstep = Math.max(0.0, parseDouble(t.substring(t.indexOf(':') + 1).trim(), defaultOdstep));
                                  }
                              }

                              if (inPlaceholders) {
                                  if (raw.startsWith("  \"") && t.endsWith(":")) {
                                      currentPlaceholder = unquote(t.substring(0, t.length() - 1).trim());
                                      h.placeholders.putIfAbsent(currentPlaceholder, new LinkedHashMap<>());
                                  } else if (raw.startsWith("    \"") && currentPlaceholder != null && t.contains(":")) {
                                      int colon = t.indexOf(':');
                                      String key = unquote(t.substring(0, colon).trim());
                                      String value = unquote(t.substring(colon + 1).trim());
                                      h.placeholders.get(currentPlaceholder).put(key, value);
                                  }
                              }
                          }

                          h.syncPlaceholderSections();
                          return h;
                      } catch (Exception e) {
                          return null;
                      }
                  }

                  private static double parseDouble(String s, double fallback) {
                      try { return Double.parseDouble(unquote(s)); } catch (Exception e) { return fallback; }
                  }

                  private static String unquote(String s) {
                      s = s.trim();
                      if (s.length() >= 2 && s.startsWith("\"") && s.endsWith("\"")) {
                          s = s.substring(1, s.length() - 1);
                      }
                      return s.replace("\\\"", "\"").replace("\\\\", "\\");
                  }

                  private static String escape(String s) {
                      return s.replace("\\", "\\\\").replace("\"", "\\\"");
                  }
              }
          }
          EOF

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp target/HologramPlugin-2.0.0.jar release/HologramPlugin.jar

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: HologramPlugin
          path: release/HologramPlugin.jar
