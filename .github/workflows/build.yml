name: Build Hub2Login ULTRA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create project
        shell: bash
        run: |
          mkdir -p src/main/java/pl/hub2login src/main/resources

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>

            <groupId>pl.hub2login</groupId>
            <artifactId>Hub2Login</artifactId>
            <version>1.2.0</version>

            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <release>21</release>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: Hub2Login
          version: 1.2.0
          main: pl.hub2login.Hub2Login
          api-version: '1.21'
          EOF

          cat > src/main/java/pl/hub2login/Hub2Login.java <<'EOF'
          package pl.hub2login;

          import org.bukkit.Bukkit;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerJoinEvent;
          import org.bukkit.plugin.java.JavaPlugin;
          import org.bukkit.plugin.messaging.PluginMessageListener;

          import java.nio.charset.StandardCharsets;
          import java.util.UUID;

          public final class Hub2Login extends JavaPlugin
                  implements Listener, PluginMessageListener {

              private static final String CHANNEL = "velocitylogin:main";

              @Override
              public void onEnable() {
                  Bukkit.getPluginManager().registerEvents(this, this);
                  Bukkit.getMessenger().registerIncomingPluginChannel(this, CHANNEL, this);
              }

              @Override
              public void onDisable() {
                  Bukkit.getMessenger().unregisterIncomingPluginChannel(this, CHANNEL, this);
              }

              @EventHandler
              public void onJoin(PlayerJoinEvent event) {
                  lock(event.getPlayer());
              }

              @Override
              public void onPluginMessageReceived(
                      String channel,
                      Player receiver,
                      byte[] message) {

                  if (!CHANNEL.equals(channel)) {
                      return;
                  }

                  String data = new String(message, StandardCharsets.UTF_8);

                  if (data.startsWith("LOCK|")) {
                      changeState(data.substring(5), false);
                  } else if (data.startsWith("UNLOCK|")) {
                      changeState(data.substring(7), true);
                  }
              }

              private void changeState(String uuidText, boolean unlock) {
                  try {
                      UUID uuid = UUID.fromString(uuidText);
                      Player player = Bukkit.getPlayer(uuid);

                      if (player == null) {
                          return;
                      }

                      if (unlock) {
                          unlock(player);
                      } else {
                          lock(player);
                      }
                  } catch (IllegalArgumentException ignored) {
                  }
              }

              /*
               * ZERO PlayerMoveEvent.
               * ZERO repeating tasks.
               * ZERO timers.
               *
               * Movement is disabled directly on the Player object.
               */
              private void lock(Player player) {
                  player.setWalkSpeed(0.0f);
                  player.setFlySpeed(0.0f);
                  player.setFlying(false);
                  player.setAllowFlight(false);
              }

              private void unlock(Player player) {
                  player.setWalkSpeed(0.2f);
                  player.setFlySpeed(0.1f);
                  player.setFlying(false);
                  player.setAllowFlight(false);
              }
          }
          EOF

      - name: Build
        run: mvn -q package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Hub2Login
          path: target/Hub2Login-*.jar
