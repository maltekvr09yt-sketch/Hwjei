name: Build HologramPlugin
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/java/pl/reniferek/hologram src/main/resources

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>pl.reniferek</groupId>
            <artifactId>HologramPlugin</artifactId>
            <version>1.7.0</version>
            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.14.0</version>
                  <configuration><release>21</release></configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: HologramPlugin
          version: 1.7.0
          main: pl.reniferek.hologram.HologramPlugin
          api-version: '1.21'
          commands:
            hologram:
              description: Zarządzanie hologramami
              aliases: [holo]
              permission: hologram.admin
          permissions:
            hologram.admin:
              default: op
          EOF

          cat > src/main/java/pl/reniferek/hologram/HologramPlugin.java <<'EOF'
          package pl.reniferek.hologram;
          import org.bukkit.plugin.java.JavaPlugin;
          public final class HologramPlugin extends JavaPlugin {
            @Override public void onEnable(){ getLogger().info("HologramPlugin 1.7.0 uruchomiony."); }
          }
          EOF

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        run: mvn -B -ntp package

      - uses: actions/upload-artifact@v4
        with:
          name: HologramPlugin
          path: target/HologramPlugin-1.7.0.jar
          if-no-files-found: error
