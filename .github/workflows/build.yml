name: Build AdventureCommand

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create project
        shell: bash
        run: |
          set -e

          mkdir -p src/main/java/pl/reniferek/adventurecommand
          mkdir -p src/main/resources

          cat > pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">

              <modelVersion>4.0.0</modelVersion>

              <groupId>pl.reniferek</groupId>
              <artifactId>AdventureCommand</artifactId>
              <version>1.0.0</version>

              <properties>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
                  <maven.compiler.release>21</maven.compiler.release>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.4-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>

          </project>
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: AdventureCommand
          version: 1.0.0
          main: pl.reniferek.adventurecommand.AdventureCommand
          api-version: '1.21'
          author: Reniferek
          description: Sets every player to Adventure on join.
          EOF

          cat > src/main/java/pl/reniferek/adventurecommand/AdventureCommand.java <<'EOF'
          package pl.reniferek.adventurecommand;

          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.EventPriority;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerJoinEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          public final class AdventureCommand extends JavaPlugin implements Listener {

              @Override
              public void onEnable() {
                  getServer().getPluginManager().registerEvents(this, this);
              }

              @EventHandler(priority = EventPriority.HIGHEST)
              public void onJoin(PlayerJoinEvent event) {
                  Player player = event.getPlayer();

                  getServer().dispatchCommand(
                          getServer().getConsoleSender(),
                          "gamemode adventure " + player.getName()
                  );
              }
          }
          EOF

      - name: Build
        run: mvn -B package --no-transfer-progress

      - name: Prepare ZIP
        run: |
          mkdir -p release
          cp target/AdventureCommand-1.0.0.jar release/AdventureCommand.jar
          cd release
          zip -9 ../AdventureCommand.zip AdventureCommand.jar

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AdventureCommand
          path: AdventureCommand.zip
          if-no-files-found: error
