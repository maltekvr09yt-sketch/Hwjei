                              ChatColor.GRAY + "- gracze na aktualnym hubie");

                      player.sendMessage(ChatColor.WHITE +
                              "%online_LifeStealSMP% " +
                              ChatColor.GRAY + "- liczba graczy LifeStealSMP");

                      player.sendMessage(ChatColor.WHITE +
                              "%status_LifeStealSMP% " +
                              ChatColor.GRAY + "- status LifeStealSMP");

                      player.sendMessage(ChatColor.WHITE +
                              "%blokada_LifeStealSMP% " +
                              ChatColor.GRAY + "- stan blokady LifeStealSMP");
                  }

                  @Override
                  public List<String> onTabComplete(
                          CommandSender sender,
                          Command command,
                          String alias,
                          String[] args
                  ) {
                      // Celowo NIE pokazujemy ID po samym /hologram.
                      if (args.length == 1) {
                          return filter(
                                  List.of(
                                          "stworz",
                                          "wybierz",
                                          "usun",
                                          "reload",
                                          "list",
                                          "help"
                                  ),
                                  args[0]
                          );
                      }

                      if (args.length == 2 &&
                          args[0].equalsIgnoreCase("wybierz")) {

                          return filter(
                                  plugin.ids().stream()
                                          .map(String::valueOf)
                                          .toList(),
                                  args[1]
                          );
                      }

                      if (args.length == 3 &&
                          args[0].equalsIgnoreCase("wybierz")) {

                          return filter(
                                  List.of(
                                          "przesun",
                                          "zmien_nazwe",
                                          "dodaj_linijke",
                                          "usun"
                                  ),
                                  args[2]
                          );
                      }

                      if (args.length == 4 &&
                          args[0].equalsIgnoreCase("wybierz") &&
                          (args[2].equalsIgnoreCase("zmien_nazwe") ||
                           args[2].equalsIgnoreCase("usun"))) {

                          Integer id = integer(args[1]);

                          if (id == null) return List.of();

                          List<String> lines = new ArrayList<>();

                          for (int i = 0; i < plugin.count(id); i++) {
                              lines.add(String.valueOf(i));
                          }

                          return filter(lines, args[3]);
                      }

                      if (args.length == 2 &&
                          (args[0].equalsIgnoreCase("usun") ||
                           args[0].equalsIgnoreCase("usuń"))) {

                          return filter(
                                  plugin.ids().stream()
                                          .map(String::valueOf)
                                          .toList(),
                                  args[1]
                          );
                      }

                      if (args.length == 4 &&
                          args[0].equalsIgnoreCase("usun") &&
                          args[2].equalsIgnoreCase("linijka")) {

                          Integer id = integer(args[1]);

                          if (id == null) return List.of();

                          List<String> lines = new ArrayList<>();

                          for (int i = 0; i < plugin.count(id); i++) {
                              lines.add(String.valueOf(i));
                          }

                          return filter(lines, args[3]);
                      }

                      if (args.length == 2 &&
                          args[0].equalsIgnoreCase("list")) {

                          return filter(
                                  plugin.ids().stream()
                                          .map(String::valueOf)
                                          .toList(),
                                  args[1]
                          );
                      }

                      return List.of();
                  }

                  private static List<String> filter(
                          List<String> values,
                          String input
                  ) {
                      List<String> result = new ArrayList<>();

                      for (String value : values) {
                          if (value.toLowerCase(Locale.ROOT)
                                  .startsWith(input.toLowerCase(Locale.ROOT))) {
                              result.add(value);
                          }
                      }

                      return result;
                  }

                  private static Integer integer(String value) {
                      try {
                          return Integer.parseInt(value);
                      } catch (NumberFormatException exception) {
                          return null;
                      }
                  }

                  private static String join(String[] args, int start) {
                      StringBuilder result = new StringBuilder();

                      for (int i = start; i < args.length; i++) {
                          if (i > start) result.append(' ');
                          result.append(args[i]);
                      }

                      return result.toString();
                  }
              }
          }
          EOF

      - name: Build
        run: mvn -B package --no-transfer-progress

      - name: Prepare ZIP
        run: |
          set -e
          mkdir -p release
          cp target/HologramPlugin-1.3.1.jar release/HologramPlugin.jar
          cd release
          zip -9 ../HologramPlugin-BRIDGE.zip HologramPlugin.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HologramPlugin-BRIDGE
          path: HologramPlugin-BRIDGE.zip
          if-no-files-found: error
