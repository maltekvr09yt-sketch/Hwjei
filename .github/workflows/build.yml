name: Build ServerTeleport

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Paper + Velocity
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Paper project
        shell: bash
        run: |
          set -e

          mkdir -p paper/src/main/java/pl/reniferek/servertp
          mkdir -p paper/src/main/resources

          cat > paper/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">

              <modelVersion>4.0.0</modelVersion>

              <groupId>pl.reniferek</groupId>
              <artifactId>ServerTeleport-Paper</artifactId>
              <version>1.0.0</version>

              <properties>
                  <maven.compiler.release>21</maven.compiler.release>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.4-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>

                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-jar-plugin</artifactId>
                          <version>3.4.2</version>
                      </plugin>
                  </plugins>
              </build>

          </project>
          EOF

          cat > paper/src/main/resources/plugin.yml <<'EOF'
          name: ServerTeleport
          version: 1.0.0
          main: pl.reniferek.servertp.ServerTeleport
          api-version: '1.21'
          author: Reniferek
          description: Bardzo lekki teleport Paper -> Velocity.
          EOF

          cat > paper/src/main/resources/config.yml <<'EOF'
          server: "LifeStealSMPspawn"

          min-x: -4
          max-x: 4

          min-y: 68
          max-y: 77

          z: 9

          require-air: false
          once-per-entry: true
          EOF

          cat > paper/src/main/java/pl/reniferek/servertp/ServerTeleport.java <<'EOF'
          package pl.reniferek.servertp;

          import com.google.common.io.ByteArrayDataOutput;
          import com.google.common.io.ByteStreams;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.EventPriority;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          public final class ServerTeleport extends JavaPlugin implements Listener {

              private static final String CHANNEL = "serverteleport:main";

              private String targetServer;

              private int minX;
              private int maxX;
              private int minY;
              private int maxY;
              private int targetZ;

              private boolean requireAir;
              private boolean oncePerEntry;

              private final Set<UUID> insidePlayers = new HashSet<>();

              @Override
              public void onEnable() {

                  saveDefaultConfig();

                  targetServer = getConfig().getString(
                          "server",
                          "LifeStealSMPspawn"
                  );

                  minX = getConfig().getInt("min-x", -4);
                  maxX = getConfig().getInt("max-x", 4);

                  minY = getConfig().getInt("min-y", 68);
                  maxY = getConfig().getInt("max-y", 77);

                  targetZ = getConfig().getInt("z", 9);

                  requireAir = getConfig().getBoolean(
                          "require-air",
                          false
                  );

                  oncePerEntry = getConfig().getBoolean(
                          "once-per-entry",
                          true
                  );

                  getServer()
                          .getMessenger()
                          .registerOutgoingPluginChannel(
                                  this,
                                  CHANNEL
                          );

                  getServer()
                          .getPluginManager()
                          .registerEvents(this, this);
              }

              @Override
              public void onDisable() {

                  insidePlayers.clear();

                  getServer()
                          .getMessenger()
                          .unregisterOutgoingPluginChannel(
                                  this,
                                  CHANNEL
                          );
              }

              @EventHandler(
                      priority = EventPriority.MONITOR,
                      ignoreCancelled = true
              )
              public void onMove(PlayerMoveEvent event) {

                  if (!event.hasChangedBlock()) {
                      return;
                  }

                  Player player = event.getPlayer();

                  int x = event.getTo().getBlockX();
                  int y = event.getTo().getBlockY();
                  int z = event.getTo().getBlockZ();

                  boolean inside =
                          x >= minX &&
                          x <= maxX &&
                          y >= minY &&
                          y <= maxY &&
                          z == targetZ;

                  UUID uuid = player.getUniqueId();

                  if (!inside) {
                      if (oncePerEntry) {
                          insidePlayers.remove(uuid);
                      }
                      return;
                  }

                  if (oncePerEntry && !insidePlayers.add(uuid)) {
                      return;
                  }

                  if (requireAir) {
                      if (!player.getLocation().getBlock().isEmpty()) {
                          return;
                      }
                  }

                  sendTeleportRequest(player);
              }

              private void sendTeleportRequest(Player player) {

                  ByteArrayDataOutput out =
                          ByteStreams.newDataOutput();

                  out.writeUTF("CHECK");
                  out.writeUTF(targetServer);

                  player.sendPluginMessage(
                          this,
                          CHANNEL,
                          out.toByteArray()
                  );
              }
          }
          EOF

      - name: Build Paper
        working-directory: paper
        run: mvn -B clean package

      - name: Create Velocity project
        shell: bash
        run: |
          set -e

          mkdir -p velocity/src/main/java/pl/reniferek/servertp
          mkdir -p velocity/src/main/resources

          cat > velocity/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">

              <modelVersion>4.0.0</modelVersion>

              <groupId>pl.reniferek</groupId>
              <artifactId>ServerTeleport-Velocity</artifactId>
              <version>1.2.0</version>

              <properties>
                  <maven.compiler.release>21</maven.compiler.release>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>com.velocitypowered</groupId>
                      <artifactId>velocity-api</artifactId>
                      <version>3.4.0-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                              <annotationProcessorPaths>
                                  <path>
                                      <groupId>com.velocitypowered</groupId>
                                      <artifactId>velocity-api</artifactId>
                                      <version>3.4.0-SNAPSHOT</version>
                                  </path>
                              </annotationProcessorPaths>
                          </configuration>
                      </plugin>

                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-jar-plugin</artifactId>
                          <version>3.4.2</version>
                      </plugin>
                  </plugins>
              </build>

          </project>
          EOF

          cat > velocity/src/main/resources/velocity-plugin.json <<'EOF'
          {
            "id": "servertp",
            "name": "ServerTeleport",
            "version": "1.2.0",
            "description": "Lekki system teleportowania Paper -> Velocity.",
            "authors": [
              "Reniferek"
            ],
            "main": "pl.reniferek.servertp.ServerTeleportVelocity"
          }
          EOF

          cat > velocity/src/main/java/pl/reniferek/servertp/ServerTeleportVelocity.java <<'EOF'
          package pl.reniferek.servertp;

          import com.google.common.io.ByteArrayDataInput;
          import com.google.common.io.ByteStreams;
          import com.velocitypowered.api.command.SimpleCommand;
          import com.velocitypowered.api.event.Subscribe;
          import com.velocitypowered.api.event.connection.PluginMessageEvent;
          import com.velocitypowered.api.event.proxy.ProxyInitializeEvent;
          import com.velocitypowered.api.plugin.Plugin;
          import com.velocitypowered.api.proxy.Player;
          import com.velocitypowered.api.proxy.ProxyServer;
          import com.velocitypowered.api.proxy.RegisteredServer;
          import com.velocitypowered.api.proxy.messages.MinecraftChannelIdentifier;

          import javax.inject.Inject;
          import java.util.Optional;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ConcurrentMap;

          @Plugin(
                  id = "servertp",
                  name = "ServerTeleport",
                  version = "1.2.0",
                  description = "Lekki system teleportowania Paper -> Velocity.",
                  authors = {"Reniferek"}
          )
          public final class ServerTeleportVelocity {

              private static final MinecraftChannelIdentifier CHANNEL =
                      MinecraftChannelIdentifier.from(
                              "serverteleport:main"
                      );

              private final ProxyServer proxy;

              private volatile boolean blockade = false;

              private final ConcurrentMap<String, Boolean> pingCache =
                      new ConcurrentHashMap<>();

              @Inject
              public ServerTeleportVelocity(ProxyServer proxy) {
                  this.proxy = proxy;
              }

              @Subscribe
              public void onProxyInitialization(ProxyInitializeEvent event) {

                  proxy.getChannelRegistrar().register(CHANNEL);

                  proxy.getCommandManager().register(
                          proxy.getCommandManager()
                                  .metaBuilder("blokadaLifeStealSMP")
                                  .build(),
                          new BlockCommand()
                  );

                  proxy.getCommandManager().register(
                          proxy.getCommandManager()
                                  .metaBuilder("statusLifeStealSMP")
                                  .build(),
                          new StatusCommand()
                  );
              }

              @Subscribe
              public void onPluginMessage(PluginMessageEvent event) {

                  if (!CHANNEL.equals(event.getIdentifier())) {
                      return;
                  }

                  event.setResult(
                          PluginMessageEvent.ForwardResult.handled()
                  );

                  if (!(event.getSource()
                          instanceof com.velocitypowered.api.proxy.ServerConnection backend)) {
                      return;
                  }

                  if (!(event.getTarget() instanceof Player player)) {
                      return;
                  }

                  ByteArrayDataInput in =
                          ByteStreams.newDataInput(event.getData());

                  final String action;

                  try {
                      action = in.readUTF();
                  } catch (Exception ignored) {
                      return;
                  }

                  if (!"CHECK".equals(action)) {
                      return;
                  }

                  final String targetName;

                  try {
                      targetName = in.readUTF();
                  } catch (Exception ignored) {
                      return;
                  }

                  if (blockade) {
                      player.sendMessage(
                              net.kyori.adventure.text.Component.text(
                                      "LifeStealSMP jest aktualnie zablokowany."
                              )
                      );
                      return;
                  }

                  Optional<RegisteredServer> optionalTarget =
                          proxy.getServer(targetName);

                  if (optionalTarget.isEmpty()) {
                      player.sendMessage(
                              net.kyori.adventure.text.Component.text(
                                      "LifeStealSMP jest aktualnie wyłączony."
                              )
                      );
                      return;
                  }

                  RegisteredServer target =
                          optionalTarget.get();

                  target.ping().whenComplete(
                          (ping, error) -> {

                              if (error != null) {
                                  player.sendMessage(
                                          net.kyori.adventure.text.Component.text(
                                                  "LifeStealSMP jest aktualnie wyłączony."
                                          )
                                  );
                                  return;
                              }

                              if (!player.isActive()) {
                                  return;
                              }

                              player.createConnectionRequest(target)
                                      .connect()
                                      .exceptionally(connectionError -> {
                                          if (player.isActive()) {
                                              player.sendMessage(
                                                      net.kyori.adventure.text.Component.text(
                                                              "Nie udało się połączyć z LifeStealSMP."
                                                      )
                                              );
                                          }
                                          return null;
                                      });
                          }
                  );
              }

              private final class BlockCommand
                      implements SimpleCommand {

                  @Override
                  public void execute(
                          Invocation invocation
                  ) {

                      String[] args = invocation.arguments();

                      if (args.length != 1) {
                          invocation.source().sendMessage(
                                  net.kyori.adventure.text.Component.text(
                                          "/blokadaLifeStealSMP on/off"
                                  )
                          );
                          return;
                      }

                      if (args[0].equalsIgnoreCase("on")) {

                          blockade = true;

                          invocation.source().sendMessage(
                                  net.kyori.adventure.text.Component.text(
                                          "Blokada LifeStealSMP: WŁĄCZONA"
                                  )
                          );

                          return;
                      }

                      if (args[0].equalsIgnoreCase("off")) {

                          blockade = false;

                          invocation.source().sendMessage(
                                  net.kyori.adventure.text.Component.text(
                                          "Blokada LifeStealSMP: WYŁĄCZONA"
                                  )
                          );

                          return;
                      }

                      invocation.source().sendMessage(
                              net.kyori.adventure.text.Component.text(
                                      "/blokadaLifeStealSMP on/off"
                              )
                      );
                  }
              }

              private final class StatusCommand
                      implements SimpleCommand {

                  @Override
                  public void execute(
                          Invocation invocation
                  ) {

                      Optional<RegisteredServer> server =
                              proxy.getServer("LifeStealSMPspawn");

                      boolean registered = server.isPresent();

                      invocation.source().sendMessage(
                              net.kyori.adventure.text.Component.text(
                                      "§7§m--------------------"
                              )
                      );

                      invocation.source().sendMessage(
                              net.kyori.adventure.text.Component.text(
                                      "§eLifeStealSMP"
                              )
                      );

                      invocation.source().sendMessage(
                              net.kyori.adventure.text.Component.text(
                                      "§7Blokada: " +
                                              (blockade
                                                      ? "§cZABLOKOWANY"
                                                      : "§aODBLOKOWANY")
                              )
                      );

                      invocation.source().sendMessage(
                              net.kyori.adventure.text.Component.text(
                                      "§7Serwer: " +
                                              (registered
                                                      ? "§aURUCHOMIONY"
                                                      : "§cWYŁĄCZONY")
                              )
                      );

                      invocation.source().sendMessage(
                              net.kyori.adventure.text.Component.text(
                                      "§7§m--------------------"
                              )
                      );
                  }
              }
          }
          EOF

      - name: Build Velocity
        working-directory: velocity
        run: mvn -B clean package

      - name: Prepare plugins
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp \
            paper/target/ServerTeleport-Paper-1.0.0.jar \
            artifacts/ServerTeleport-Paper.jar

          cp \
            velocity/target/ServerTeleport-Velocity-1.2.0.jar \
            artifacts/ServerTeleport-Velocity.jar

      - name: Upload Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport-Paper
          path: artifacts/ServerTeleport-Paper.jar
          if-no-files-found: error

      - name: Upload Velocity plugin
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport-Velocity
          path: artifacts/ServerTeleport-Velocity.jar
          if-no-files-found: error
