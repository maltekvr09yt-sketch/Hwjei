                      player.sendMessage(ChatColor.WHITE +
                              "/hologram stworz " +
                              ChatColor.GRAY + "- tworzy hologram");

                      player.sendMessage(ChatColor.WHITE +
                              "/hologram wybierz <id> przesun " +
                              ChatColor.GRAY + "- przesuwa caly hologram");

                      player.sendMessage(ChatColor.WHITE +
                              "/hologram wybierz <id> dodaj_linijke <tekst> " +
                              ChatColor.GRAY + "- dodaje linie");

                      player.sendMessage(ChatColor.WHITE +
                              "/hologram wybierz <id> zmien_nazwe <linia> <tekst> " +
                              ChatColor.GRAY + "- zmienia linie");

                      player.sendMessage(ChatColor.WHITE +
                              "/hologram wybierz <id> usun <linia> " +
                              ChatColor.GRAY + "- usuwa linie");

                      player.sendMessage(ChatColor.WHITE +
                              "/hologram usun <id> " +
                              ChatColor.GRAY + "- usuwa hologram");

                      player.sendMessage(ChatColor.WHITE +
                              "/hologram list " +
                              ChatColor.GRAY + "- pokazuje liczbe hologramow");

                      player.sendMessage(ChatColor.WHITE +
                              "/hologram list <id> " +
                              ChatColor.GRAY + "- pokazuje liczbe linii");

                      player.sendMessage(ChatColor.WHITE +
                              "/hologram reload " +
                              ChatColor.GRAY + "- przeladowuje hologramy");

                      player.sendMessage(ChatColor.WHITE +
                              "/hologram help " +
